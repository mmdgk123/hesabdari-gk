<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حسابداری">
<meta name="theme-color" content="#07080d">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>حسابداری</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IRANSansX:wght@300;400;500;600;700;800;900;1000&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07080d;
  --bg2:#0a0c13;
  --card:rgba(255,255,255,.035);
  --card2:rgba(255,255,255,.055);
  --border:rgba(255,255,255,.08);
  --border2:rgba(255,255,255,.14);
  --text:#f2f3f8;
  --text2:#a0a5ba;
  --text3:#606478;
  --red:#ff4d6d;
  --green:#2de0a5;
  --gold:#ffc857;
  --blue:#6c9bff;
  --purple:#b18cff;
  --glow-red:rgba(255,77,109,.45);
  --glow-green:rgba(45,224,165,.4);
}
html{background:var(--bg)}
body{
  font-family:'IRANSansX',system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(ellipse 120% 50% at 50% -10%, rgba(108,155,255,.09), transparent),
    radial-gradient(ellipse 90% 40% at 85% 15%, rgba(177,140,255,.06), transparent),
    radial-gradient(ellipse 100% 45% at 10% 30%, rgba(45,224,165,.04), transparent),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
  padding:0 0 130px;
  direction:rtl;
  -webkit-font-smoothing:antialiased;
}

/* ═══════ Header with live clock feel ═══════ */
.header{padding:24px 22px 18px;position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--bg) 65%,transparent);
}
.header::after{content:'';position:absolute;bottom:0;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent)}
.header-top{display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:26px;font-weight:1000;letter-spacing:-.5px;background:linear-gradient(135deg,#fff 30%,#9db8ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.header-date{font-size:12.5px;color:var(--text3);margin-top:3px;font-weight:500}

/* ═══════ Hero Balance — aurora glass ═══════ */
.hero{
  position:relative;overflow:hidden;
  margin:6px 16px 20px;
  border-radius:28px;padding:2px;
  background:linear-gradient(140deg,rgba(108,155,255,.5),rgba(177,140,255,.28) 35%,rgba(45,224,165,.25) 70%,rgba(108,155,255,.45));
}
.hero-inner{
  position:relative;overflow:hidden;
  border-radius:26px;padding:26px 24px 22px;
  background:linear-gradient(160deg,#12141f 0%,#0c0e18 55%,#0a0c14 100%);
}
.hero-inner::before{
  content:'';position:absolute;width:280px;height:280px;border-radius:50%;
  top:-140px;left:-60px;filter:blur(50px);opacity:.5;
  background:radial-gradient(circle,#3d63d8,transparent 65%);
  animation:drift1 9s ease-in-out infinite alternate;
}
.hero-inner::after{
  content:'';position:absolute;width:240px;height:240px;border-radius:50%;
  bottom:-130px;right:-50px;filter:blur(50px);opacity:.4;
  background:radial-gradient(circle,#149e72,transparent 65%);
  animation:drift2 11s ease-in-out infinite alternate;
}
@keyframes drift1{to{transform:translate(50px,35px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-45px,-25px) scale(1.1)}}
.hero-content{position:relative;z-index:2}
.hero-label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2);font-weight:600}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green),0 0 4px var(--green);animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.hero-amount{font-size:38px;font-weight:1000;margin-top:12px;letter-spacing:-1px;color:#fff;text-shadow:0 2px 24px rgba(255,255,255,.15)}
.hero-unit{font-size:14px;font-weight:500;color:var(--text2);margin-right:6px}
.hero-row{display:flex;gap:10px;margin-top:20px}
.hero-chip{flex:1;position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-radius:16px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(10px)}
.hero-chip small{font-size:10.5px;color:var(--text2);font-weight:600;display:block;margin-bottom:3px}
.hero-chip b{font-size:15.5px;font-weight:900;letter-spacing:-.3px}
.hc-exp{box-shadow:inset 0 0 24px rgba(255,77,109,.06)}.hc-exp b{color:var(--red)}
.hc-inc{box-shadow:inset 0 0 24px rgba(45,224,165,.06)}.hc-inc b{color:var(--green)}

/* ═══════ Stats strip ═══════ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px 18px}
.stat{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border:1px solid var(--border);border-radius:18px;padding:13px 6px;text-align:center;
}
.stat::before{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,currentColor,transparent);opacity:.5}
.stat-num{font-size:14.5px;font-weight:1000;letter-spacing:-.3px;margin-bottom:3px}
.sr .stat-num{color:var(--red)}.sg .stat-num{color:var(--green)}.sy .stat-num{color:var(--gold)}.sb .stat-num{color:var(--blue)}
.stat-label{font-size:9.5px;color:var(--text3);font-weight:600}

/* ═══════ Filter pills ═══════ */
.section-head{display:flex;justify-content:space-between;align-items:center;margin:4px 20px 10px}
.section-title{font-size:15.5px;font-weight:800;letter-spacing:-.2px}
.filter-pills{display:flex;gap:7px;margin:0 16px 14px;overflow-x:auto;padding:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filter-pills::-webkit-scrollbar{display:none}
.filter-pill{
  padding:9px 17px;border-radius:100px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  transition:all .25s cubic-bezier(.4,0,.2,1);
  color:var(--text2);background:rgba(255,255,255,.04);border:1px solid transparent;
}
.filter-pill.active{background:#fff;color:#0a0c14;border-color:#fff;box-shadow:0 6px 20px -6px rgba(255,255,255,.35)}

/* ═══════ Search ═══════ */
.search-wrap{margin:0 16px 14px;position:relative}
.search-wrap input{width:100%;padding:13px 44px 13px 15px;border:1.5px solid var(--border);border-radius:16px;
  font-size:13.5px;font-family:inherit;font-weight:500;color:var(--text);
  background:rgba(255,255,255,.04);outline:none;transition:all .25s}
.search-wrap input:focus{border-color:rgba(108,155,255,.5);background:rgba(108,155,255,.06);box-shadow:0 0 0 4px rgba(108,155,255,.08)}
.search-wrap input::placeholder{color:var(--text3)}
.search-wrap svg{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}

/* ═══════ Entries — premium rows ═══════ */
.entries{margin:0 16px;display:flex;flex-direction:column;gap:9px}
.entry{
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:13px;
  padding:14px 15px;border-radius:20px;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border:1px solid var(--border);
  animation:popIn .5s cubic-bezier(.21,1.02,.55,1) backwards;
  transition:transform .2s,border-color .2s;
}
.entry:hover{transform:translateY(-1px);border-color:var(--border2)}
@keyframes popIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.tx-icon{
  width:46px;height:46px;border-radius:15px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  position:relative;
}
.ic-exp{
  background:linear-gradient(145deg,rgba(255,77,109,.16),rgba(255,77,109,.04));
  border:1px solid rgba(255,77,109,.22);
  box-shadow:0 4px 16px -4px var(--glow-red), inset 0 1px 0 rgba(255,255,255,.1);
}
.ic-inc{
  background:linear-gradient(145deg,rgba(45,224,165,.16),rgba(45,224,165,.04));
  border:1px solid rgba(45,224,165,.22);
  box-shadow:0 4px 16px -4px var(--glow-green), inset 0 1px 0 rgba(255,255,255,.1);
}
.entry-body{flex:1;min-width:0}
.entry-title{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-meta{font-size:10.5px;color:var(--text3);margin-top:4px;display:flex;gap:6px;align-items:center;font-weight:500}
.chip{padding:2.5px 9px;border-radius:7px;font-size:9px;font-weight:800;letter-spacing:.2px}
.chip-melat{background:rgba(255,255,255,.09);color:#dfe2ec;border:1px solid rgba(255,255,255,.14)}
.chip-saderat{background:rgba(108,155,255,.13);color:#9dbcff;border:1px solid rgba(108,155,255,.28)}
.entry-amt{text-align:left;flex-shrink:0}
.entry-amt b{font-size:15.5px;font-weight:1000;letter-spacing:-.4px;white-space:nowrap;display:inline-block}
.entry.exp .entry-amt b{color:var(--red);text-shadow:0 0 20px var(--glow-red)}
.entry.inc .entry-amt b{color:var(--green);text-shadow:0 0 20px var(--glow-green)}
.entry-amt span{font-size:9px;color:var(--text3);display:block;margin-top:2px;text-align:left;font-weight:600}
.entry-actions{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.entry-btn{width:29px;height:29px;border-radius:10px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;opacity:.6;transition:all .18s}
.entry-btn.edit{background:rgba(108,155,255,.13);color:var(--blue)}
.entry-btn.del{background:rgba(255,77,109,.13);color:var(--red)}
.entry-btn:active{opacity:1;transform:scale(.88)}

/* ═══════ Empty state ═══════ */
.empty{text-align:center;padding:56px 20px;color:var(--text3)}
.empty-icon{font-size:44px;margin-bottom:14px;filter:grayscale(.4);opacity:.7}
.empty-text{font-size:14px;line-height:2;font-weight:500}


/* ═══════ FAB ═══════ */
.fab{
  position:fixed;bottom:96px;left:22px;width:62px;height:62px;border-radius:22px;border:none;cursor:pointer;
  z-index:30;line-height:1;font-size:28px;color:#fff;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#ff5f7d,#e01a48);
  box-shadow:0 16px 40px -10px rgba(225,26,72,.6), 0 4px 12px rgba(0,0,0,.4), inset 0 1.5px 0 rgba(255,255,255,.3);
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
}
.fab::before{content:'';position:absolute;inset:-6px;border-radius:28px;background:radial-gradient(circle,rgba(255,95,125,.35),transparent 70%);z-index:-1;animation:fabGlow 3s ease-in-out infinite}
@keyframes fabGlow{0%,100%{opacity:.5}50%{opacity:1}}
.fab:active{transform:scale(.86) rotate(90deg)}

/* ═══════ Sheet (add form) ═══════ */
.sheet-bg{position:fixed;inset:0;background:rgba(4,5,9,.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:100;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.sheet{
  width:100%;max-width:480px;padding:14px 22px calc(30px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#141724,#0e1019);
  border:1px solid var(--border2);border-bottom:none;
  border-radius:32px 32px 0 0;
  box-shadow:0 -20px 60px rgba(0,0,0,.6);
  animation:sheetUp .38s cubic-bezier(.32,.72,.35,1.02);
}
@keyframes sheetUp{from{transform:translateY(105%)}to{transform:none}}
.sheet-handle{width:44px;height:4.5px;border-radius:5px;background:rgba(255,255,255,.18);margin:0 auto 18px}

.type-tabs{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:18px;padding:4px;margin-bottom:20px}
.type-tab{flex:1;padding:12px;text-align:center;font-size:14px;font-weight:800;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);color:var(--text3);border-radius:14px}
.type-tab.active.exp{background:linear-gradient(135deg,#ff5f7d,#e01a48);color:#fff;box-shadow:0 8px 22px -6px rgba(225,26,72,.55)}
.type-tab.active.inc{background:linear-gradient(135deg,#2de0a5,#0aa873);color:#03130d;box-shadow:0 8px 22px -6px rgba(10,168,115,.55)}

.field{margin-bottom:15px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--text2);margin-bottom:8px;letter-spacing:.2px}
.field input{width:100%;padding:15px 16px;border:1.5px solid var(--border);border-radius:17px;
  font-size:15.5px;font-family:inherit;font-weight:600;color:var(--text);
  background:rgba(255,255,255,.04);outline:none;transition:all .25s}
.field input:focus{border-color:rgba(108,155,255,.55);background:rgba(108,155,255,.05);box-shadow:0 0 0 4px rgba(108,155,255,.1)}
.field input::placeholder{color:var(--text3);font-weight:400}
.amount-field{position:relative}
.amount-field::after{content:'هزار تومان';position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--text3);font-weight:600;pointer-events:none}
.amount-field input{padding-left:92px;font-size:21px;font-weight:900;letter-spacing:.3px}

.card-pills{display:flex;gap:9px}
.card-pill{flex:1;padding:13px;border:1.5px solid var(--border);border-radius:16px;text-align:center;font-size:13.5px;font-weight:700;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);color:var(--text2);background:rgba(255,255,255,.03)}
.card-pill.active.melat{border-color:rgba(223,226,236,.5);background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.04));color:#fff;box-shadow:0 6px 18px -8px rgba(255,255,255,.25)}
.card-pill.active.saderat{border-color:rgba(108,155,255,.6);background:linear-gradient(135deg,rgba(108,155,255,.16),rgba(108,155,255,.05));color:#9dbcff;box-shadow:0 6px 18px -8px rgba(108,155,255,.4)}

.quick-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.quick-chip{padding:9px 14px;border-radius:100px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text2);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .18s}
.quick-chip:active{transform:scale(.9)}
.quick-chip.sel{border-color:rgba(108,155,255,.55);background:rgba(108,155,255,.13);color:#9dbcff}

.submit-btn{
  width:100%;padding:18px;border:none;border-radius:20px;
  font-size:16px;font-weight:900;font-family:inherit;cursor:pointer;color:#fff;letter-spacing:.3px;
  transition:all .2s;position:relative;overflow:hidden;margin-top:4px;
}
.submit-btn::after{content:'';position:absolute;top:0;right:-120%;width:55%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.3),transparent);animation:shine 2.6s infinite}
@keyframes shine{0%{right:-120%}55%,100%{right:170%}}
.submit-btn:active{transform:scale(.97)}
.submit-btn.exp{background:linear-gradient(135deg,#ff5f7d,#e01a48);box-shadow:0 14px 34px -10px rgba(225,26,72,.6), inset 0 1.5px 0 rgba(255,255,255,.25)}
.submit-btn.inc{background:linear-gradient(135deg,#2de0a5,#0aa873);color:#03130d;box-shadow:0 14px 34px -10px rgba(10,168,115,.6), inset 0 1.5px 0 rgba(255,255,255,.4)}

/* ═══════ Edit modal ═══════ */
.modal-bg{position:fixed;inset:0;background:rgba(4,5,9,.65);backdrop-filter:blur(6px);z-index:110;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex;animation:fadeIn .25s}
.modal{width:100%;max-width:480px;padding:14px 22px calc(30px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#141724,#0e1019);
  border:1px solid var(--border2);border-bottom:none;
  border-radius:32px 32px 0 0;
  box-shadow:0 -20px 60px rgba(0,0,0,.6);
  animation:sheetUp .38s cubic-bezier(.32,.72,.35,1.02)}
.modal h3{font-size:17px;font-weight:900;text-align:center;margin-bottom:20px}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.modal-btns button{flex:1;padding:15px;border:none;border-radius:17px;font-size:14.5px;font-weight:800;font-family:inherit;cursor:pointer;transition:all .2s}
.modal-btns button:active{transform:scale(.97)}
.modal-save{background:linear-gradient(135deg,#6c9bff,#3d63d8);color:#fff;box-shadow:0 10px 26px -8px rgba(61,99,216,.5)}
.modal-cancel{background:rgba(255,255,255,.06);color:var(--text2)}

/* ═══════ Bottom bar ═══════ */
.bottom-actions{
  position:fixed;bottom:0;left:0;right:0;z-index:25;
  display:flex;gap:7px;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,rgba(7,8,13,.92) 30%,#07080d);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.bottom-btn{
  flex:1;padding:13px 4px;border:1px solid var(--border);border-radius:16px;
  font-size:11px;font-weight:800;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:4px;
  transition:all .18s;background:rgba(255,255,255,.04);white-space:nowrap;
  backdrop-filter:blur(10px);
}
.bottom-btn:active{transform:scale(.94)}
.btn-blue{color:#9dbcff}.btn-blue:active{background:rgba(108,155,255,.18)}
.btn-purple{color:#cbb2ff}.btn-purple:active{background:rgba(177,140,255,.18)}
.btn-amber{color:#ffd98a}.btn-amber:active{background:rgba(255,200,87,.18)}
.btn-red{color:#ff8fa3}.btn-red:active{background:rgba(255,77,109,.18)}

.toast{
  position:fixed;bottom:170px;left:50%;transform:translateX(-50%) translateY(10px);
  padding:12px 24px;background:#fff;color:#0a0c14;border-radius:100px;
  font-size:13px;font-weight:800;opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);
  z-index:300;pointer-events:none;
  box-shadow:0 14px 40px -8px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.1)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:0}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <h1>حسابداری</h1>
      <div class="header-date" id="headerDate"></div>
    </div>
  </div>
</div>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-content">
      <div class="hero-label"><span class="live-dot"></span> مانده حساب</div>
      <div class="hero-amount"><span id="balAmount">۰</span><span class="hero-unit">تومان</span></div>
      <div class="hero-row">
        <div class="hero-chip hc-exp"><span><small>خرج</small></span><b id="balExp">۰</b></div>
        <div class="hero-chip hc-inc"><span><small>دخل</small></span><b id="balInc">۰</b></div>
      </div>
    </div>
  </div>
</div>

<div class="stats" id="statsBox" style="display:none">
  <div class="stat sr"><div class="stat-num" id="sExp">۰</div><div class="stat-label">خرج</div></div>
  <div class="stat sg"><div class="stat-num" id="sInc">۰</div><div class="stat-label">دخل</div></div>
  <div class="stat sb"><div class="stat-num" id="sCnt">۰</div><div class="stat-label">تراکنش</div></div>
</div>


<div class="filter-pills" id="filterBox" style="display:none">
  <div class="filter-pill active" onclick="setTab('all',this)">همه</div>
  <div class="filter-pill" onclick="setTab('expense',this)">خرج</div>
  <div class="filter-pill" onclick="setTab('income',this)">دخل</div>
  <div id="monthPills"></div>
</div>

<div class="section-head" id="listHeader" style="display:none"><div class="section-title">تراکنش‌ها</div></div>

<div class="search-wrap" id="searchBox" style="display:none">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  <input type="text" id="searchInput" placeholder="جستجو در تراکنش‌ها..." oninput="renderAll()">
</div>

<div class="entries" id="entriesList"></div>

<button class="fab" onclick="openSheet()">＋</button>

<!-- Add Sheet -->
<div class="sheet-bg" id="addSheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="type-tabs">
      <div class="type-tab active exp" id="tabExp" onclick="setType('expense')">خرج</div>
      <div class="type-tab" id="tabInc" onclick="setType('income')">دخل</div>
    </div>
    <div class="field"><label>مبلغ</label><div class="amount-field"><input type="text" id="amount" inputmode="numeric" placeholder="مثلاً ۵۰۰" oninput="formatAmount(this)"></div></div>
    <div class="field"><label>بابت چی؟</label><input type="text" id="desc" placeholder="نون، اسنپ، آرایشگاه..."></div>
    <div class="field"><label>کارت</label><div class="card-pills"><div class="card-pill active melat" id="cpMelat" onclick="setCard('ملت')">ملت</div><div class="card-pill" id="cpSad" onclick="setCard('صادرات')">صادرات</div></div></div>
    <div class="quick-row" id="quickRow"></div>
    <button class="submit-btn exp" id="submitBtn" onclick="addEntry()">ثبت خرج</button>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3>ویرایش تراکنش</h3>
    <div class="field"><label>مبلغ (هزار تومان)</label><div class="amount-field"><input type="text" id="editAmt" inputmode="numeric" oninput="formatAmount(this)"></div></div>
    <div class="field"><label>بابت چی؟</label><input type="text" id="editDesc"></div>
    <div class="field"><label>کارت</label><div class="card-pills"><div class="card-pill" id="ecMelat" onclick="setEditCard('ملت')">ملت</div><div class="card-pill" id="ecSad" onclick="setEditCard('صادرات')">صادرات</div></div></div>
    <div class="modal-btns"><button class="modal-cancel" onclick="closeModal()">لغو</button><button class="modal-save" onclick="saveEdit()">ذخیره</button></div>
  </div>
</div>

<div class="bottom-actions">
  <button class="bottom-btn btn-blue" onclick="copyAll()">کپی 📋</button>
  <button class="bottom-btn btn-purple" onclick="dlBackup()">بکاپ 💾</button>
  <button class="bottom-btn btn-amber" onclick="document.getElementById('fileIn').click()">بازگردانی 📂</button>
  <button class="bottom-btn btn-red" onclick="clearAll()">پاک کردن 🗑</button>
  <input type="file" id="fileIn" accept=".json" style="display:none" onchange="restore(event)">
</div>

<div class="toast" id="toast"></div>

<script>
let type='expense',card='ملت',currentTab='all',editIdx=-1,editCardVal='ملت';
let entries=JSON.parse(localStorage.getItem('dakhel_entries')||'[]');

/* ─── Jalali ─── */
function g2j(gy,gm,gd){
  var g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  var gy2=(gm>2)?(gy+1):gy;
  var days=355666+(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+g_d_m[gm-1];
  var jy=-1595+Math.floor(33*(Math.floor(days/12053)));days%=12053;jy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365;}
  var jm,jd;if(days<186){jm=1+Math.floor(days/31);jd=1+days%31;}else{jm=7+Math.floor((days-186)/30);jd=1+(days-186)%30;}
  return[jy,jm,jd];
}
function jMonthName(m){return['','فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'][m]||''}
function fa2en(s){var m={'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};return s.replace(/[۰-۹]/g,c=>m[c]||c)}
function fmt(n){return n.toLocaleString('fa-IR')}

function nowJalali(){
  var s=new Date().toLocaleString('sv-SE',{timeZone:'Asia/Tehran'});
  var p=s.split(' '),d=p[0].split('-'),t=p[1].split(':');
  var j=g2j(+d[0],+d[1],+d[2]);
  return{str:`${j[0]}/${String(j[1]).padStart(2,'0')}/${String(j[2]).padStart(2,'0')} ${jMonthName(j[1])} ${t[0]}:${t[1]}`,y:j[0],m:j[1],d:j[2]};
}

function updateHeader(){
  var j=nowJalali();
  document.getElementById('headerDate').textContent=`${j.d} ${jMonthName(j.m)} ${j.y}`;
}

/* ─── Sheet & Quick chips ─── */
function openSheet(){
  document.getElementById('addSheet').classList.add('show');
  setTimeout(()=>document.getElementById('amount').focus(),380);
}
function closeSheet(){document.getElementById('addSheet').classList.remove('show');}
document.getElementById('addSheet').addEventListener('click',function(e){if(e.target===this)closeSheet();});

var quickCats=[['🍞 نون','نان'],['🚗 اسنپ','اسنپ'],['📄 قبض','قبض'],['🏋️ سانس','سانس'],['💊 دارو','دارو'],['🎮 بازی','بازی'],['🛒 خرید','خرید']];
var quickSel='';
function buildQuick(){
  document.getElementById('quickRow').innerHTML=
    quickCats.map((q,i)=>`<button type="button" class="quick-chip" onclick="pickQuick(${i})">${q[0]}</button>`).join('');
}
function pickQuick(i){
  var chips=document.querySelectorAll('#quickRow .quick-chip');
  var already=chips[i].classList.contains('sel');
  chips.forEach(c=>c.classList.remove('sel'));
  if(already){quickSel='';return;}
  chips[i].classList.add('sel');quickSel=quickCats[i][1];
  document.getElementById('desc').value=quickCats[i][1];
  setTimeout(()=>document.getElementById('amount').focus(),80);
}
function formatAmount(el){
  var v=fa2en(el.value).replace(/[^\d]/g,'');
  el.value=v?parseInt(v).toLocaleString('en-US'):'';
}

/* ─── Type & Card ─── */
function setType(t){
  type=t;
  document.getElementById('tabExp').className='type-tab'+(t==='expense'?' active exp':'');
  document.getElementById('tabInc').className='type-tab'+(t==='income'?' active inc':'');
  var b=document.getElementById('submitBtn');
  b.className='submit-btn '+(t==='expense'?'exp':'inc');
  b.textContent=t==='expense'?'ثبت خرج':'ثبت دخل';
}
function setCard(c){
  card=c;
  document.getElementById('cpMelat').className='card-pill'+(c==='ملت'?' active melat':'');
  document.getElementById('cpSad').className='card-pill'+(c==='صادرات'?' active saderat':'');
}
function setEditCard(c){
  editCardVal=c;
  document.getElementById('ecMelat').className='card-pill'+(c==='ملت'?' active melat':'');
  document.getElementById('ecSad').className='card-pill'+(c==='صادرات'?' active saderat':'');
}
function setTab(t,el){
  currentTab=t;
  document.querySelectorAll('.filter-pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  renderAll();
}

/* ─── Add / Edit / Delete ─── */
function addEntry(){
  var amt=fa2en(document.getElementById('amount').value.trim()).replace(/,/g,'');
  if(!amt||amt==0){toast('مبلغ رو وارد کن ⚠️');return;}
  var desc=document.getElementById('desc').value.trim();
  if(!desc){toast('توضیح رو وارد کن ⚠️');return;}
  var j=nowJalali();
  entries.push({type,amount:parseInt(amt)*1000,desc,card,date:j.str,year:j.y,month:j.m,day:j.d});
  save();
  document.getElementById('amount').value='';document.getElementById('desc').value='';
  document.querySelectorAll('#quickRow .quick-chip').forEach(c=>c.classList.remove('sel'));
  quickSel='';buildMonthPills();
  closeSheet();renderAll();
  toast(type==='expense'?'خرج ثبت شد ✓':'دخل ثبت شد ✓');
}
function openEdit(i){
  editIdx=i;editCardVal=entries[i].card;
  document.getElementById('editAmt').value=Math.round(entries[i].amount/1000).toLocaleString('en-US');
  document.getElementById('editDesc').value=entries[i].desc;
  setEditCard(editCardVal);
  document.getElementById('editModal').classList.add('show');
}
function saveEdit(){
  var amt=fa2en(document.getElementById('editAmt').value.trim()).replace(/,/g,'');
  if(!amt||amt==0){toast('مبلغ رو وارد کن ⚠️');return;}
  var desc=document.getElementById('editDesc').value.trim();
  if(!desc){toast('توضیح رو وارد کن ⚠️');return;}
  entries[editIdx].amount=parseInt(amt)*1000;entries[editIdx].desc=desc;entries[editIdx].card=editCardVal;
  save();closeModal();renderAll();toast('ویرایش شد ✓');
}
function closeModal(){document.getElementById('editModal').classList.remove('show');}
document.getElementById('editModal').addEventListener('click',function(e){if(e.target===this)closeModal();});
function delEntry(i){if(!confirm('پاک بشه؟'))return;entries.splice(i,1);save();renderAll();toast('پاک شد 🗑');}

/* ─── Filter ─── */
function buildMonthPills(){
  var set=new Set();
  entries.forEach(e=>set.add(e.year+'/'+e.month));
  var keys=[...set].sort().reverse();
  document.getElementById('monthPills').innerHTML=keys.map(k=>{
    var p=k.split('/');
    return `<div class="filter-pill" onclick="setTab('m:${k}',this)">${jMonthName(+p[1])}</div>`;
  }).join('');
}
function filtered(){
  var l=[...entries];
  if(currentTab==='expense')l=l.filter(e=>e.type==='expense');
  else if(currentTab==='income')l=l.filter(e=>e.type==='income');
  else if(currentTab.startsWith('m:')){
    var p=currentTab.slice(2).split('/');
    l=l.filter(e=>e.year===+p[0]&&e.month===+p[1]);
  }
  var q=document.getElementById('searchInput')?.value?.trim()?.toLowerCase()||'';
  if(q)l=l.filter(e=>e.desc.toLowerCase().includes(q)||e.card.includes(q));
  return l;
}

/* ─── Icons ─── */
var icons={نون:'🍞',نان:'🍞',اسنپ:'🚗',آرایشگاه:'✂️',قبض:'📄',پارچه:'🧵',بیمه:'🛡️',دارو:'💊',پنکه:'🌀',فیلترشکن:'🔒',تورنمنت:'🎮',گیمنت:'🕹️',بیسکوییت:'🍪',کادو:'🎁',خرید:'🛒',شارژ:'📱',اینترنت:'🌐',سرور:'🖥️',گیفت:'🎁',سانس:'🏋️',ویزیت:'🏥',دمپایی:'🩴',روکش:'🏍️',مته:'🔧',پفک:'🍿',اشتراک:'📺',سالن:'🏊',لبنیات:'🥛',دینار:'💰',قرض:'💸',نذری:'🙏',برنج:'🍚'};
function getIcon(d){
  for(var k in icons)if(d.includes(k))return icons[k];
  if(d.includes('روغن')||d.includes('ماشین'))return '🚗';
  if(d.includes('پول'))return '💰';
  return '📝';
}

/* ─── Render ─── */
function save(){localStorage.setItem('dakhel_entries',JSON.stringify(entries));}
function renderAll(){
  var f=filtered();
  var scope=(currentTab.startsWith('m:')||currentTab==='expense'||currentTab==='income')?f:entries;
  var allE=scope.filter(e=>e.type==='expense'),allI=scope.filter(e=>e.type==='income');
  var totE=allE.reduce((s,e)=>s+e.amount,0),totI=allI.reduce((s,e)=>s+e.amount,0);
  var bal=totI-totE;
  
  document.getElementById('balAmount').textContent=fmt(bal);
  document.getElementById('balExp').textContent=fmt(totE);
  document.getElementById('balInc').textContent=fmt(totI);
  document.getElementById('sExp').textContent=fmt(totE);
  document.getElementById('sInc').textContent=fmt(totI);
    document.getElementById('sCnt').textContent=fmt(scope.length);

  var show=entries.length>0;
  document.getElementById('statsBox').style.display=show?'grid':'none';
  document.getElementById('filterBox').style.display=show?'flex':'none';
  document.getElementById('listHeader').style.display=show?'flex':'none';
  document.getElementById('searchBox').style.display=show?'block':'none';

  var list=document.getElementById('entriesList');
  if(!f.length){
    list.innerHTML='<div class="empty"><div class="empty-icon">'+(entries.length?'🔍':'✨')+'</div><div class="empty-text">'+(entries.length?'نتیجه‌ای پیدا نشد':'هنوز چیزی ثبت نشده<br>دکمه ＋ پایین صفحه منتظرته')+'</div></div>';
    return;
  }
  var h='',anim=0;
  for(var i=entries.length-1;i>=0;i--){
    var e=entries[i];if(!f.includes(e))continue;
    var isE=e.type==='expense';
    anim++;
    h+=`<div class="entry ${isE?'exp':'inc'}" style="animation-delay:${Math.min(anim*.045,.45)}s">
      <div class="tx-icon ${isE?'ic-exp':'ic-inc'}">${getIcon(e.desc)}</div>
      <div class="entry-body"><div class="entry-title">${e.desc}</div><div class="entry-meta"><span class="chip ${e.card==='ملت'?'chip-melat':'chip-saderat'}">${e.card}</span><span>${e.date.split(' ').slice(0,2).join(' ')}</span></div></div>
      <div class="entry-amt"><b>${isE?'−':'+'} ${fmt(e.amount)}</b><span>تومان</span></div>
      <div class="entry-actions"><button class="entry-btn edit" onclick="openEdit(${i})">✏️</button><button class="entry-btn del" onclick="delEntry(${i})">✕</button></div>
    </div>`;
  }
  list.innerHTML=h;

  var j=nowJalali(),ts=`${j.y}/${j.m}/${j.d}`;
}

/* ─── Copy / Backup / Restore / Clear ─── */
function copyAll(){
  if(!entries.length){toast('چیزی نیست ⚠️');return;}
  var t='خرج\n';
  entries.filter(e=>e.type==='expense').forEach(e=>{t+=`📆 [${e.date}]\n💰 مبلغ: ${fmt(e.amount)}\n📝 بابت: ${e.desc}\n💳 کارت: ${e.card}\n--------------------------------------------------\n`;});
  t+='\nدخل\n';
  entries.filter(e=>e.type==='income').forEach(e=>{t+=`📆 [${e.date}]\n💰 مبلغ: ${fmt(e.amount)}\n📝 بابت: ${e.desc}\n💳 کارت: ${e.card}\n--------------------------------------------------\n`;});
  navigator.clipboard.writeText(t).then(()=>toast('کپی شد ✅')).catch(()=>{var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);toast('کپی شد ✅');});
}
function dlBackup(){
  if(!entries.length){toast('چیزی نیست ⚠️');return;}
  var b=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'});
  var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`dakhel_${new Date().toISOString().split('T')[0]}.json`;a.click();URL.revokeObjectURL(u);toast('بکاپ دانلود شد 💾');
}
function restore(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(ev){
    try{var d=JSON.parse(ev.target.result);if(!Array.isArray(d)){toast('فایل نامعتبر ⚠️');return;}
    if(!confirm(d.length+' تراکنش پیدا شد. اضافه بشه؟'))return;
    entries=entries.concat(d);save();renderAll();toast(d.length+' تراکنش بازگردانی شد ✓');}
    catch(err){toast('خطا ⚠️');}
  };r.readAsText(f);e.target.value='';
}
function clearAll(){if(!confirm('همه پاک بشه؟'))return;entries=[];save();renderAll();toast('پاک شد 🗑');}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

updateHeader();setType("expense");buildQuick();buildMonthPills();renderAll();
if("serviceWorker" in navigator)navigator.serviceWorker.register("/dakhel-app/sw.js");
</script>
</body>
</html>
