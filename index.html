<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حسابداری">
<meta name="theme-color" content="#0b0d14">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>حسابداری</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IRANSansX:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0d14;
  --card:#141722;
  --card2:#181c2a;
  --border:rgba(255,255,255,.07);
  --text:#eef0f6;
  --text2:#9aa0b4;
  --text3:#5c6172;
  --red:#ff5c72;
  --green:#3ee08f;
  --gold:#ffc857;
  --blue:#5b8dff;
  --purple:#a78bfa;
}
html{background:var(--bg)}
body{font-family:'IRANSansX',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 110px;direction:rtl;-webkit-font-smoothing:antialiased}

/* ─── Header ─── */
.header{background:rgba(11,13,20,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:20px 20px 16px;position:sticky;top:0;z-index:10}
.header-top{display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:22px;font-weight:900;color:var(--text);letter-spacing:-.3px}
.header-date{font-size:13px;color:var(--text3);margin-top:2px}

/* ─── Balance Card (glass glow) ─── */
.balance-v1{
  position:relative;overflow:hidden;
  margin:16px;
  background:linear-gradient(135deg,#1a2140 0%,#10142a 55%,#0d1020 100%);
  border:1px solid rgba(120,140,255,.18);
  border-radius:24px;padding:26px;
  box-shadow:0 20px 50px -20px rgba(60,80,200,.35), inset 0 1px 0 rgba(255,255,255,.06);
}
.balance-v1::before{content:'';position:absolute;top:-70px;left:-40px;width:220px;height:220px;background:radial-gradient(circle,rgba(91,141,255,.25),transparent 65%);}
.balance-v1::after{content:'';position:absolute;bottom:-80px;right:-30px;width:200px;height:200px;background:radial-gradient(circle,rgba(62,224,143,.12),transparent 65%);}
.bv1-label{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;position:relative;z-index:1}
.bv1-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.bv1-amount{font-size:34px;font-weight:900;margin-top:10px;letter-spacing:-.5px;background:linear-gradient(90deg,#fff,#c7d2fe);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;position:relative;z-index:1}
.bv1-unit{font-size:13px;font-weight:400;-webkit-text-fill-color:var(--text2)}
.bv1-row{display:flex;gap:10px;margin-top:18px;position:relative;z-index:1}
.bv1-item{flex:1;background:rgba(255,255,255,.05);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:11px}
.bv1-item small{font-size:10px;color:var(--text2);display:block;margin-bottom:3px}
.bv1-item b{font-size:14px;font-weight:800}
.bv1-item.exp b{color:var(--red)}.bv1-item.inc b{color:var(--green)}

/* ─── Chart ─── */
.chart-card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:22px;padding:22px;margin:0 16px 16px;display:none;box-shadow:0 10px 30px -15px rgba(0,0,0,.5)}
.chart-card.show{display:block}
.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.chart-title{font-size:13px;font-weight:800}
.chart-sub{font-size:10px;color:var(--text3);margin-top:2px}
.donut-wrap{display:flex;align-items:center;gap:20px;justify-content:center}
.donut{width:130px;height:130px;border-radius:50%;position:relative;box-shadow:0 8px 24px -8px rgba(0,0,0,.6);transition:background .5s ease}
.donut::after{content:'';position:absolute;inset:16px;background:var(--card2);border-radius:50%;box-shadow:inset 0 2px 8px rgba(0,0,0,.4)}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
.donut-center b{font-size:15px;font-weight:900}
.donut-center span{font-size:9px;color:var(--text3)}
.legend{display:flex;flex-direction:column;gap:8px}
.lg{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text2)}
.lg i{width:8px;height:8px;border-radius:3px;flex-shrink:0}
.lg b{color:var(--text);margin-right:auto;padding-right:8px}

/* ─── Stats ─── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 16px 16px}
.stat{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:14px;padding:12px 6px;text-align:center;box-shadow:0 4px 14px -6px rgba(0,0,0,.4)}
.stat-num{font-size:13.5px;font-weight:900;margin-bottom:2px}
.stat-num.red{color:var(--red)}.stat-num.green{color:var(--green)}.stat-num.gold{color:var(--gold)}.stat-num.blue{color:var(--blue)}
.stat-label{font-size:9.5px;color:var(--text3);font-weight:500}

/* ─── Filter & Search ─── */
.section-header{display:flex;justify-content:space-between;align-items:center;margin:0 16px 10px}
.section-title{font-size:15px;font-weight:800;color:var(--text)}
.filter-pills{display:flex;gap:6px;margin:0 16px 12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filter-pills::-webkit-scrollbar{display:none}
.filter-pill{padding:8px 15px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;color:var(--text2);background:var(--card);border:1px solid var(--border)}
.filter-pill.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 14px -4px rgba(91,141,255,.5)}
.search-wrap{margin:0 16px 12px;position:relative}
.search-wrap input{width:100%;padding:11px 14px 11px 36px;border:1.5px solid var(--border);border-radius:14px;font-size:13px;font-family:inherit;color:var(--text);background:var(--card);outline:none;transition:border .2s}
.search-wrap input:focus{border-color:var(--blue)}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3)}

/* ─── Entries ─── */
.entries{margin:0 16px}
.entry{
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--border);
  border-radius:18px;padding:13px 14px;margin-bottom:9px;
  box-shadow:0 4px 14px -6px rgba(0,0,0,.45);
  transition:border-color .2s;
  animation:slideIn .45s ease backwards;
}
@keyframes slideIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.tx-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.ic-red{background:linear-gradient(135deg,rgba(255,92,114,.18),rgba(255,92,114,.06));border:1px solid rgba(255,92,114,.2)}
.ic-green{background:linear-gradient(135deg,rgba(62,224,143,.18),rgba(62,224,143,.06));border:1px solid rgba(62,224,143,.2)}
.entry-body{flex:1;min-width:0}
.entry-title{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-meta{font-size:10.5px;color:var(--text3);margin-top:4px;display:flex;gap:6px;align-items:center}
.chip{padding:2px 8px;border-radius:6px;font-size:9px;font-weight:700}
.chip-melat{background:rgba(255,255,255,.08);color:#d4d8e2;border:1px solid rgba(255,255,255,.12)}
.chip-saderat{background:rgba(91,141,255,.12);color:var(--blue);border:1px solid rgba(91,141,255,.25)}
.entry-amt{text-align:left;flex-shrink:0}
.entry-amt b{font-size:14.5px;font-weight:900;letter-spacing:-.3px;white-space:nowrap}
.entry.exp .entry-amt b{color:var(--red)}.entry.inc .entry-amt b{color:var(--green)}
.entry-amt span{font-size:9px;color:var(--text3);display:block;margin-top:1px;text-align:left}
.entry-actions{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.entry-btn{width:28px;height:28px;border-radius:9px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;opacity:.75;transition:all .15s}
.entry-btn.edit{background:rgba(91,141,255,.12);color:var(--blue)}.entry-btn.edit:active{opacity:1;background:rgba(91,141,255,.3)}
.entry-btn.del{background:rgba(255,92,114,.12);color:var(--red)}.entry-btn.del:active{opacity:1;background:rgba(255,92,114,.3)}

/* ─── Empty / Warning ─── */
.empty{text-align:center;padding:48px 20px;color:var(--text3)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-text{font-size:14px;line-height:1.8}
.warning{margin:0 16px 12px;padding:12px 14px;background:rgba(255,92,114,.08);border:1px solid rgba(255,92,114,.25);border-radius:14px;font-size:13px;color:var(--red);display:none;align-items:center;gap:8px}
.warning.show{display:flex}

/* ─── FAB ─── */
.fab{
  position:fixed;bottom:86px;left:20px;width:60px;height:60px;border-radius:20px;border:none;cursor:pointer;
  font-size:26px;color:#fff;z-index:20;
  background:linear-gradient(135deg,#ff5c72,#e11d48);
  box-shadow:0 14px 34px -8px rgba(225,29,72,.55), inset 0 1px 0 rgba(255,255,255,.25);
  transition:all .2s;line-height:1;
}
.fab:active{transform:scale(.9)}

/* ─── Add Sheet ─── */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:var(--card2);border:1px solid var(--border);border-bottom:none;border-radius:26px 26px 0 0;padding:22px 20px 40px;width:100%;max-width:480px;animation:slideUp .3s cubic-bezier(.32,.72,.35,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:42px;height:4px;border-radius:4px;background:rgba(255,255,255,.15);margin:0 auto 16px}
.type-tabs{display:flex;background:rgba(11,13,20,.6);border:1px solid var(--border);border-radius:16px;padding:4px;margin-bottom:18px}
.type-tab{flex:1;padding:11px;text-align:center;font-size:13.5px;font-weight:700;cursor:pointer;transition:all .25s;color:var(--text3);border-radius:12px}
.type-tab.active.exp{background:linear-gradient(135deg,#ff5c72,#e11d48);color:#fff;box-shadow:0 6px 18px -6px rgba(225,29,72,.5)}
.type-tab.active.inc{background:linear-gradient(135deg,#3ee08f,#0ea86a);color:#04140c;box-shadow:0 6px 18px -6px rgba(14,168,106,.5)}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:7px}
.field input{width:100%;padding:14px 15px;border:1.5px solid var(--border);border-radius:14px;font-size:15px;font-family:inherit;color:var(--text);background:rgba(11,13,20,.6);outline:none;transition:border .2s, box-shadow .2s}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,141,255,.12)}
.field input::placeholder{color:var(--text3)}
.amount-field{position:relative}
.amount-field::after{content:'هزار تومان';position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text3);pointer-events:none}
.amount-field input{padding-left:85px;font-size:19px;font-weight:800}
.card-pills{display:flex;gap:8px}
.card-pill{flex:1;padding:12px;border:1.5px solid var(--border);border-radius:14px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--text2);background:rgba(11,13,20,.4)}
.card-pill.active.melat{border-color:#8a93a8;background:rgba(255,255,255,.07);color:#d4d8e2}
.card-pill.active.saderat{border-color:var(--blue);background:rgba(91,141,255,.1);color:var(--blue)}
.quick-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.quick-chip{padding:8px 13px;border-radius:20px;border:1px solid var(--border);background:rgba(11,13,20,.4);color:var(--text2);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.quick-chip:active{transform:scale(.92)}
.quick-chip.sel{border-color:var(--blue);background:rgba(91,141,255,.12);color:var(--blue)}
.submit-btn{
  width:100%;padding:17px;border:none;border-radius:18px;
  font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;color:#fff;
  transition:all .2s;position:relative;overflow:hidden;margin-top:6px;
}
.submit-btn::after{content:'';position:absolute;top:0;right:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);animation:shine 2.8s infinite}
@keyframes shine{0%{right:-100%}50%,100%{right:150%}}
.submit-btn:active{transform:scale(.97)}
.submit-btn.exp{background:linear-gradient(135deg,#ff5c72,#e11d48);box-shadow:0 12px 28px -8px rgba(225,29,72,.45), inset 0 1px 0 rgba(255,255,255,.2)}
.submit-btn.inc{background:linear-gradient(135deg,#3ee08f,#0ea86a);color:#04140c;box-shadow:0 12px 28px -8px rgba(14,168,106,.45), inset 0 1px 0 rgba(255,255,255,.35)}

/* ─── Edit Modal ─── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--card2);border:1px solid var(--border);border-bottom:none;border-radius:26px 26px 0 0;padding:22px 20px 36px;width:100%;max-width:480px;animation:slideUp .3s cubic-bezier(.32,.72,.35,1)}
.modal h3{font-size:17px;font-weight:800;text-align:center;margin-bottom:18px;color:var(--text)}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.modal-btns button{flex:1;padding:14px;border:none;border-radius:14px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
.modal-save{background:var(--blue);color:#fff}.modal-cancel{background:rgba(255,255,255,.06);color:var(--text2)}

/* ─── Bottom Actions ─── */
.bottom-actions{position:fixed;bottom:0;left:0;right:0;background:rgba(11,13,20,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:12px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;z-index:10}
.bottom-btn{flex:1;padding:11px 4px;border:none;border-radius:12px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;transition:all .15s;white-space:nowrap}
.bottom-btn:active{transform:scale(.96)}
.btn-blue{background:rgba(91,141,255,.12);color:var(--blue)}
.btn-purple{background:rgba(167,139,250,.12);color:var(--purple)}
.btn-amber{background:rgba(255,200,87,.1);color:var(--gold)}
.btn-red{background:rgba(255,92,114,.1);color:var(--red)}

.toast{position:fixed;bottom:160px;left:50%;transform:translateX(-50%);padding:10px 22px;background:#eef0f6;color:#0b0d14;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:all .2s;z-index:200;pointer-events:none;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.toast.show{opacity:1}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#2a2d3e;border-radius:2px}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <h1>💰 حسابداری</h1>
      <div class="header-date" id="headerDate"></div>
    </div>
  </div>
</div>

<div class="balance-v1">
  <div class="bv1-label"><span class="bv1-dot"></span> مانده حساب</div>
  <div class="bv1-amount"><span id="balAmount">۰</span> <span class="bv1-unit">تومان</span></div>
  <div class="bv1-row">
    <div class="bv1-item exp"><small>🔴 خرج</small><b id="balExp">۰</b></div>
    <div class="bv1-item inc"><small>🟢 دخل</small><b id="balInc">۰</b></div>
  </div>
</div>

<div class="stats" id="statsBox" style="display:none">
  <div class="stat"><div class="stat-num red" id="sExp">۰</div><div class="stat-label">خرج</div></div>
  <div class="stat"><div class="stat-num green" id="sInc">۰</div><div class="stat-label">دخل</div></div>
  <div class="stat"><div class="stat-num gold" id="sAvg">۰</div><div class="stat-label">میانگین/روز</div></div>
  <div class="stat"><div class="stat-num blue" id="sCnt">۰</div><div class="stat-label">تراکنش</div></div>
</div>

<div class="warning" id="warning">⚠️ <span id="warningTxt"></span></div>

<div class="filter-pills" id="filterBox" style="display:none">
  <div class="filter-pill active" onclick="setTab('all',this)">همه</div>
  <div class="filter-pill" onclick="setTab('expense',this)">🔴 خرج</div>
  <div class="filter-pill" onclick="setTab('income',this)">🟢 دخل</div>
  <div id="monthPills"></div>
</div>

<div class="section-header" id="listHeader" style="display:none"><div class="section-title">تراکنش‌ها</div></div>

<div class="search-wrap" id="searchBox" style="display:none">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  <input type="text" id="searchInput" placeholder="جستجو..." oninput="renderAll()">
</div>

<div class="entries" id="entriesList"></div>

<button class="fab" onclick="openSheet()">＋</button>

<!-- Add Sheet -->
<div class="sheet-bg" id="addSheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="type-tabs">
      <div class="type-tab active exp" id="tabExp" onclick="setType('expense')">🔴 خرج</div>
      <div class="type-tab" id="tabInc" onclick="setType('income')">🟢 دخل</div>
    </div>
    <div class="field"><label>مبلغ</label><div class="amount-field"><input type="text" id="amount" inputmode="numeric" placeholder="مثلاً ۵۰۰" oninput="formatAmount(this)"></div></div>
    <div class="field"><label>بابت چی؟</label><input type="text" id="desc" placeholder="نون، اسنپ، آرایشگاه..."></div>
    <div class="field"><label>کارت</label><div class="card-pills"><div class="card-pill active" id="cpMelat" onclick="setCard('ملت')">💳 ملت</div><div class="card-pill" id="cpSad" onclick="setCard('صادرات')">💳 صادرات</div></div></div>
    <div class="quick-row" id="quickRow"></div>
    <button class="submit-btn exp" id="submitBtn" onclick="addEntry()">ثبت خرج</button>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3>ویرایش تراکنش</h3>
    <div class="field"><label>مبلغ (هزار تومان)</label><div class="amount-field"><input type="text" id="editAmt" inputmode="numeric"></div></div>
    <div class="field"><label>بابت چی؟</label><input type="text" id="editDesc"></div>
    <div class="field"><label>کارت</label><div class="card-pills"><div class="card-pill" id="ecMelat" onclick="setEditCard('ملت')">💳 ملت</div><div class="card-pill" id="ecSad" onclick="setEditCard('صادرات')">💳 صادرات</div></div></div>
    <div class="modal-btns"><button class="modal-cancel" onclick="closeModal()">لغو</button><button class="modal-save" onclick="saveEdit()">ذخیره</button></div>
  </div>
</div>

<div class="bottom-actions">
  <button class="bottom-btn btn-blue" onclick="copyAll()">📋 کپی</button>
  <button class="bottom-btn btn-purple" onclick="dlBackup()">💾 بکاپ</button>
  <button class="bottom-btn btn-amber" onclick="document.getElementById('fileIn').click()">📂 بازگردانی</button>
  <button class="bottom-btn btn-red" onclick="clearAll()">🗑 پاک کردن</button>
  <input type="file" id="fileIn" accept=".json" style="display:none" onchange="restore(event)">
</div>

<div class="toast" id="toast"></div>

<script>
let type='expense',card='ملت',currentTab='all',editIdx=-1,editCardVal='ملت';
let entries=JSON.parse(localStorage.getItem('dakhel_entries')||'[]');
const WARN=5e6;

/* ─── Jalali ─── */
function g2j(gy,gm,gd){
  var g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  var gy2=(gm>2)?(gy+1):gy;
  var days=355666+(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+g_d_m[gm-1];
  var jy=-1595+Math.floor(33*(Math.floor(days/12053)));days%=12053;jy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365;}
  var jm,jd;if(days<186){jm=1+Math.floor(days/31);jd=1+days%31;}else{jm=7+Math.floor((days-186)/30);jd=1+(days-186)%30;}
  return[jy,jm,jd];
}
function jMonthName(m){return['','فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'][m]||''}
function fa2en(s){var m={'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};return s.replace(/[۰-۹]/g,c=>m[c]||c)}
function fmt(n){return n.toLocaleString('fa-IR')}

function nowJalali(){
  var s=new Date().toLocaleString('sv-SE',{timeZone:'Asia/Tehran'});
  var p=s.split(' '),d=p[0].split('-'),t=p[1].split(':');
  var j=g2j(+d[0],+d[1],+d[2]);
  return{str:`${j[0]}/${String(j[1]).padStart(2,'0')}/${String(j[2]).padStart(2,'0')} ${jMonthName(j[1])} ${t[0]}:${t[1]}`,y:j[0],m:j[1],d:j[2]};
}

function updateHeader(){
  var j=nowJalali();
  document.getElementById('headerDate').textContent=`${j.d} ${jMonthName(j.m)} ${j.y}`;
}

/* ─── Sheet ─── */
var quickCats=[['🍞 نون','نان'],['🚗 اسنپ','اسنپ'],['📄 قبض','قبض'],['🏋️ سانس','سانس'],['💊 دارو','دارو'],['🎮 بازی','بازی'],['🛒 خرید','خرید']];
var quickSel='';
function buildQuick(){
  var r=document.getElementById('quickRow');
  r.innerHTML=quickCats.map((q,i)=>`<button class="quick-chip" data-i="${i}" onclick="pickQuick(${i})">${q[0]}</button>`).join('');
}
function pickQuick(i){
  var chips=document.querySelectorAll('#quickRow .quick-chip');
  var already=chips[i].classList.contains('sel');
  chips.forEach(c=>c.classList.remove('sel'));
  if(already){quickSel='';return;}
  chips[i].classList.add('sel');quickSel=quickCats[i][1];
  document.getElementById('desc').value=quickCats[i][1];
  setTimeout(()=>document.getElementById('amount').focus(),80);
}
function formatAmount(el){
  var v=fa2en(el.value).replace(/[^\d]/g,'');
  el.value=v?parseInt(v).toLocaleString('en-US'):'';
}

function openSheet(){
  document.getElementById('addSheet').classList.add('show');
  setTimeout(()=>document.getElementById('amount').focus(),350);
}
function closeSheet(){document.getElementById('addSheet').classList.remove('show');}
document.getElementById('addSheet').addEventListener('click',function(e){if(e.target===this)closeSheet();});

/* ─── Type & Card ─── */
function setType(t){
  type=t;
  document.getElementById('tabExp').className='type-tab'+(t==='expense'?' active exp':'');
  document.getElementById('tabInc').className='type-tab'+(t==='income'?' active inc':'');
  var b=document.getElementById('submitBtn');
  b.className='submit-btn '+(t==='expense'?'exp':'inc');
  b.textContent=t==='expense'?'ثبت خرج':'ثبت دخل';
}
function setCard(c){
  card=c;
  document.getElementById('cpMelat').className='card-pill'+(c==='ملت'?' active melat':'');
  document.getElementById('cpSad').className='card-pill'+(c==='صادرات'?' active saderat':'');
}
function setEditCard(c){
  editCardVal=c;
  document.getElementById('ecMelat').className='card-pill'+(c==='ملت'?' active melat':'');
  document.getElementById('ecSad').className='card-pill'+(c==='صادرات'?' active saderat':'');
}
function setTab(t,el){
  currentTab=t;
  document.querySelectorAll('.filter-pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  renderAll();
}

/* ─── Add ─── */
function addEntry(){
  var raw=document.getElementById('amount').value.trim();
  var amt=fa2en(raw).replace(/,/g,'');
  if(!amt||amt==0){toast('مبلغ رو وارد کن ⚠️');return;}
  var desc=document.getElementById('desc').value.trim();
  if(!desc){toast('توضیح رو وارد کن ⚠️');return;}
  var j=nowJalali();
  entries.push({type,amount:parseInt(amt)*1000,desc,card,date:j.str,year:j.y,month:j.m,day:j.d});
  save();document.getElementById('amount').value='';document.getElementById('desc').value='';
  document.querySelectorAll('#quickRow .quick-chip').forEach(c=>c.classList.remove('sel'));
  quickSel='';
  buildMonthPills();
  closeSheet();renderAll();toast(type==='expense'?'خرج ثبت شد ✓':'دخل ثبت شد ✓');
}

/* ─── Edit ─── */
function openEdit(i){
  editIdx=i;editCardVal=entries[i].card;
  document.getElementById('editAmt').value=Math.round(entries[i].amount/1000);
  document.getElementById('editDesc').value=entries[i].desc;
  document.getElementById('ecMelat').className='card-pill'+(editCardVal==='ملت'?' active melat':'');
  document.getElementById('ecSad').className='card-pill'+(editCardVal==='صادرات'?' active saderat':'');
  document.getElementById('editModal').classList.add('show');
}
function saveEdit(){
  var amt=fa2en(document.getElementById('editAmt').value.trim()).replace(/,/g,'');
  if(!amt||amt==0){toast('مبلغ رو وارد کن ⚠️');return;}
  var desc=document.getElementById('editDesc').value.trim();
  if(!desc){toast('توضیح رو وارد کن ⚠️');return;}
  entries[editIdx].amount=parseInt(amt)*1000;entries[editIdx].desc=desc;entries[editIdx].card=editCardVal;
  save();closeModal();renderAll();toast('ویرایش شد ✓');
}
function closeModal(){document.getElementById('editModal').classList.remove('show');}
document.getElementById('editModal').addEventListener('click',function(e){if(e.target===this)closeModal();});
function delEntry(i){if(!confirm('پاک بشه؟'))return;entries.splice(i,1);save();renderAll();toast('پاک شد 🗑');}

/* ─── Filter ─── */
var monthKeys=[];
function buildMonthPills(){
  var set=new Set();
  entries.forEach(e=>set.add(e.year+'/'+e.month));
  monthKeys=[...set].sort().reverse();
  var box=document.getElementById('monthPills');
  box.innerHTML=monthKeys.map(k=>{
    var p=k.split('/');
    return `<div class="filter-pill" onclick="setTab('m:${k}',this)">${jMonthName(+p[1])}</div>`;
  }).join('');
}
function filtered(){
  var l=[...entries];
  if(currentTab==='expense')l=l.filter(e=>e.type==='expense');
  else if(currentTab==='income')l=l.filter(e=>e.type==='income');
  else if(currentTab.startsWith('m:')){
    var p=currentTab.slice(2).split('/');
    var y=+p[0],m=+p[1];
    l=l.filter(e=>e.year===y&&e.month===m);
  }
  var q=document.getElementById('searchInput')?.value?.trim()?.toLowerCase()||'';
  if(q)l=l.filter(e=>e.desc.toLowerCase().includes(q)||e.card.includes(q));
  return l;
}

/* ─── Icons ─── */
var icons={نون:'🍞',اسنپ:'🚗',آرایشگاه:'✂️',قبض:'📄',پارچه:'🧵',بیمه:'🛡️',دارو:'💊',نان:'🍞',پنکه:'🌀',فیلترشکن:'🔒',تورنمنت:'🎮',گیمنت:'🕹️',بیسکوییت:'🍪',کادو:'🎁',خرید:'🛒',شارژ:'📱',اینترنت:'🌐',سرور:'🖥️',گیفت:'🎁',سانس:'🏋️',ویزیت:'🏥',دمپایی:'🩴',روکش:'🏍️',مته:'🔧',پفک:'🍿',اشتراک:'📺',سالن:'🏊',لبنیات:'🥛',دینار:'💰',قرض:'💸',نذری:'🙏',برنج:'🍚'};
function getIcon(d){
  for(var k in icons)if(d.includes(k))return icons[k];
  if(d.includes('روغن')||d.includes('ماشین'))return '🚗';
  if(d.includes('پول'))return '💰';
  return '📝';
}

/* ─── Chart ─── */
var chartColors=['#5b8dff','#a78bfa','#ffc857','#ff5c72','#3ee08f','#22d3ee'];
var catNames=['خوراک','حمل‌ونقل','قبض و صورت‌حساب','شخصی','سلامت','متفرقه'];
function categorize(desc){
  var d=desc.toLowerCase();
  if(/نان|نون|لبنیات|بیسکوییت|خوراکی|برنج|پفک|رانی|پیتزا/.test(d))return 0;
  if(/اسنپ|تاکسی|بنزین|روغن ترمز|روکش/.test(d))return 1;
  if(/قبض|شارژ|اینترنت|برق|گاز|تلفن|سرور|اشتراک/.test(d))return 2;
  if(/آرایشگاه|کادو|گیفت|کلاه|پارچه|دمپایی|ادکلن|موبوگیفت/.test(d))return 3;
  if(/دارو|ویزیت|دکتر|بیمه|سانس|رادیولوژ/.test(d))return 4;
  return 5;
}
function renderChart(expList){
  // removed per user request
}

/* ─── Render ─── */
function save(){localStorage.setItem('dakhel_entries',JSON.stringify(entries));}
function renderAll(){
  var f=filtered();
  var scope=(currentTab.startsWith('m:'))?f:entries;
  var allE=scope.filter(e=>e.type==='expense'),allI=scope.filter(e=>e.type==='income');
  var totE=allE.reduce((s,e)=>s+e.amount,0),totI=allI.reduce((s,e)=>s+e.amount,0);
  var bal=totI-totE;
  var days=new Set(scope.map(e=>e.date.split(' ')[0])).size||1;

  document.getElementById('balAmount').textContent=fmt(bal);
  document.getElementById('balExp').textContent=fmt(totE);
  document.getElementById('balInc').textContent=fmt(totI);
  document.getElementById('sExp').textContent=fmt(totE);
  document.getElementById('sInc').textContent=fmt(totI);
  document.getElementById('sAvg').textContent=fmt(Math.round(totE/days));
  document.getElementById('sCnt').textContent=fmt(scope.length);

  var show=entries.length>0;
  document.getElementById('statsBox').style.display=show?'grid':'none';
  document.getElementById('filterBox').style.display=show?'flex':'none';
  document.getElementById('listHeader').style.display=show?'flex':'none';
  document.getElementById('searchBox').style.display=show?'block':'none';

  var list=document.getElementById('entriesList');
  if(!f.length){list.innerHTML='<div class="empty"><div class="empty-icon">'+(entries.length?'🔍':'📝')+'</div><div class="empty-text">'+(entries.length?'نتیجه‌ای پیدا نشد':'هنوز تراکنشی ثبت نشده<br>روی دکمه ＋ بزن تا ثبت کنی')+'</div></div>';return;}
  var h='',anim=0;
  for(var i=entries.length-1;i>=0;i--){
    var e=entries[i];if(!f.includes(e))continue;
    var isE=e.type==='expense';
    anim++;
    h+=`<div class="entry ${isE?'exp':'inc'}" style="animation-delay:${Math.min(anim*.05,.4)}s">
      <div class="tx-icon ${isE?'ic-red':'ic-green'}">${getIcon(e.desc)}</div>
      <div class="entry-body"><div class="entry-title">${e.desc}</div><div class="entry-meta"><span class="chip ${e.card==='ملت'?'chip-melat':'chip-saderat'}">${e.card}</span><span>${e.date.split(' ').slice(0,2).join(' ')}</span></div></div>
      <div class="entry-amt"><b>${isE?'−':'+'} ${fmt(e.amount)}</b><span>تومان</span></div>
      <div class="entry-actions"><button class="entry-btn edit" onclick="openEdit(${i})">✏️</button><button class="entry-btn del" onclick="delEntry(${i})">✕</button></div>
    </div>`;
  }
  list.innerHTML=h;

  // warning
  var j=nowJalali(),ts=`${j.y}/${j.m}/${j.d}`;
  var todayExp=entries.filter(e=>e.type==='expense'&&e.date.startsWith(ts)).reduce((s,e)=>s+e.amount,0);
  var w=document.getElementById('warning');
  if(todayExp>=WARN){document.getElementById('warningTxt').textContent=`خرج امروز ${fmt(todayExp)} تومان شد!`;w.classList.add('show');}else w.classList.remove('show');
}

/* ─── Copy ─── */
function copyAll(){
  if(!entries.length){toast('چیزی نیست ⚠️');return;}
  var t='خرج\n';
  entries.filter(e=>e.type==='expense').forEach(e=>{t+=`📆 [${e.date}]\n💰 مبلغ: ${fmt(e.amount)}\n📝 بابت: ${e.desc}\n💳 کارت: ${e.card}\n--------------------------------------------------\n`;});
  t+='\nدخل\n';
  entries.filter(e=>e.type==='income').forEach(e=>{t+=`📆 [${e.date}]\n💰 مبلغ: ${fmt(e.amount)}\n📝 بابت: ${e.desc}\n💳 کارت: ${e.card}\n--------------------------------------------------\n`;});
  navigator.clipboard.writeText(t).then(()=>toast('کپی شد ✅')).catch(()=>{var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);toast('کپی شد ✅');});
}

/* ─── Backup ─── */
function dlBackup(){
  if(!entries.length){toast('چیزی نیست ⚠️');return;}
  var b=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'});
  var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`dakhel_${new Date().toISOString().split('T')[0]}.json`;a.click();URL.revokeObjectURL(u);toast('بکاپ دانلود شد 💾');
}
function restore(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(ev){
    try{var d=JSON.parse(ev.target.result);if(!Array.isArray(d)){toast('فایل نامعتبر ⚠️');return;}
    if(!confirm(d.length+' تراکنش پیدا شد. اضافه بشه؟'))return;
    entries=entries.concat(d);save();renderAll();toast(d.length+' تراکنش بازگردانی شد ✓');}
    catch(err){toast('خطا ⚠️');}
  };r.readAsText(f);e.target.value='';
}
function clearAll(){if(!confirm('همه پاک بشه؟'))return;entries=[];save();renderAll();toast('پاک شد 🗑');}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

updateHeader();setType("expense");buildQuick();buildMonthPills();renderAll();if("serviceWorker" in navigator)navigator.serviceWorker.register("/dakhel-app/sw.js");
</script>
