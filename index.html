<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💰 دخل و خرج</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IRANSansX:wght@300;400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a1a;--card:#111128;--border:#1e1e44;--acc:#00e87b;--red:#ff1744;--txt:#c8c8e0;--mut:#3e3e5e}
body{font-family:'IRANSansX',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:16px;padding-bottom:100px}
.header{text-align:center;padding:20px 0}
.header h1{font-size:22px;color:var(--acc)}
.header p{color:var(--mut);font-size:13px;margin-top:4px}

/* Type selector */
.type-row{display:flex;gap:10px;margin-bottom:16px}
.type-btn{flex:1;padding:14px;border:2px solid var(--border);border-radius:14px;background:var(--card);color:var(--txt);font-family:'IRANSansX',sans-serif;font-size:15px;font-weight:700;cursor:pointer;text-align:center;transition:all .2s}
.type-btn.active-expense{border-color:var(--red);background:rgba(255,23,68,.1);color:var(--red)}
.type-btn.active-income{border-color:var(--acc);background:rgba(0,232,123,.1);color:var(--acc)}

/* Form */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:14px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;color:var(--txt);font-family:'IRANSansX',sans-serif;font-size:16px;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--acc)}

/* Card buttons */
.card-row{display:flex;gap:10px}
.card-btn{flex:1;padding:12px;border:2px solid var(--border);border-radius:12px;background:var(--card);color:var(--txt);font-family:'IRANSansX',sans-serif;font-size:14px;font-weight:600;cursor:pointer;text-align:center;transition:all .2s}
.card-btn.active{border-color:var(--gld);background:rgba(245,158,11,.1);color:var(--gld)}

/* Submit */
.submit-btn{width:100%;padding:16px;border:none;border-radius:14px;font-family:'IRANSansX',sans-serif;font-weight:900;font-size:17px;cursor:pointer;margin-top:10px;transition:all .2s}
.submit-btn:active{transform:scale(.97)}
.submit-expense{background:linear-gradient(135deg,#ff2255,#cc1133);color:#fff}
.submit-income{background:linear-gradient(135deg,#00ff8a,#00c06a);color:#000}

/* Entries */
.entries{margin-top:24px}
.entries h3{font-size:16px;margin-bottom:12px;color:var(--gld)}
.entry{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.entry-info{flex:1}
.entry-amount{font-weight:900;font-size:16px}
.entry-desc{font-size:12px;color:var(--mut);margin-top:2px}
.entry-meta{font-size:11px;color:var(--mut);margin-top:4px}
.entry-type-exp{color:var(--red)}
.entry-type-inc{color:var(--acc)}
.entry-delete{padding:6px 10px;background:rgba(255,23,68,.1);border:1px solid rgba(255,23,68,.3);border-radius:8px;color:var(--red);cursor:pointer;font-size:12px;font-family:'IRANSansX',sans-serif}

/* Summary */
.summary{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:16px}
.summary-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.summary-row.total{border-top:1px solid var(--border);margin-top:6px;padding-top:10px;font-weight:900;font-size:16px}

/* Actions */
.actions{display:flex;gap:10px;margin-top:16px}
.action-btn{flex:1;padding:14px;border:none;border-radius:12px;font-family:'IRANSansX',sans-serif;font-weight:700;font-size:14px;cursor:pointer;text-align:center}
.action-btn:active{transform:scale(.96)}
.copy-btn{background:linear-gradient(135deg,#00b4d8,#0077b6);color:#fff}
.clear-btn{background:rgba(255,23,68,.15);color:var(--red);border:1px solid rgba(255,23,68,.3)}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 24px;background:var(--acc);color:#000;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:opacity .3s;z-index:99;pointer-events:none}
.toast.show{opacity:1}

.empty{text-align:center;padding:30px;color:var(--mut);font-size:14px}
</style>
</head>
<body>

<div class="header">
  <h1>💰 دخل و خرج</h1>
  <p>ماه مرداد ۱۴۰۵</p>
</div>

<!-- Type -->
<div class="type-row">
  <div class="type-btn" id="btnExpense" onclick="setType('expense')">🔴 خرج</div>
  <div class="type-btn active-expense" id="btnIncome" onclick="setType('income')">🟢 دخل</div>
</div>

<!-- Amount -->
<div class="form-group">
  <label>مبلغ (تومان)</label>
  <input type="number" id="amount" inputmode="numeric" placeholder="مثلاً ۵۰۰,۰۰۰">
</div>

<!-- Description -->
<div class="form-group">
  <label>بابت چی؟</label>
  <input type="text" id="desc" placeholder="مثلاً نون، اسنپ، آرایشگاه...">
</div>

<!-- Card -->
<div class="form-group">
  <label>کارت</label>
  <div class="card-row">
    <div class="card-btn active" id="cardMelat" onclick="setCard('ملت')">ملت</div>
    <div class="card-btn" id="cardSaderat" onclick="setCard('صادرات')">صادرات</div>
  </div>
</div>

<!-- Submit -->
<button class="submit-btn submit-expense" id="submitBtn" onclick="addEntry()">➕ ثبت خرج</button>

<!-- Entries -->
<div class="entries" id="entriesSection">
  <h3>📝 لیست تراکنش‌ها</h3>
  <div id="entriesList"></div>
</div>

<!-- Summary -->
<div class="summary" id="summarySection" style="display:none">
  <div class="summary-row"><span>🔴 جمع خرج</span><span id="totalExpense" style="color:var(--red)">۰</span></div>
  <div class="summary-row"><span>🟢 جمع دخل</span><span id="totalIncome" style="color:var(--acc)">۰</span></div>
  <div class="summary-row total"><span>💰 مانده</span><span id="balance">۰</span></div>
</div>

<!-- Actions -->
<div class="actions">
  <button class="action-btn copy-btn" onclick="copyAll()">📋 کپی همه</button>
  <button class="action-btn clear-btn" onclick="clearAll()">🗑 پاک کردن</button>
</div>

<div class="toast" id="toast"></div>

<script>
let type = 'expense';
let card = 'ملت';
let entries = JSON.parse(localStorage.getItem('dakhel_entries') || '[]');

// Init type to expense
setType('expense');
renderAll();

function setType(t) {
  type = t;
  document.getElementById('btnExpense').className = t === 'expense' ? 'type-btn active-expense' : 'type-btn';
  document.getElementById('btnIncome').className = t === 'income' ? 'type-btn active-income' : 'type-btn';
  const btn = document.getElementById('submitBtn');
  if (t === 'expense') {
    btn.className = 'submit-btn submit-expense';
    btn.textContent = '➕ ثبت خرج';
  } else {
    btn.className = 'submit-btn submit-income';
    btn.textContent = '➕ ثبت دخل';
  }
}

function setCard(c) {
  card = c;
  document.getElementById('cardMelat').className = c === 'ملت' ? 'card-btn active' : 'card-btn';
  document.getElementById('cardSaderat').className = c === 'صادرات' ? 'card-btn active' : 'card-btn';
}

function addEntry() {
  let amount = document.getElementById('amount').value.replace(/,/g, '');
  if (!amount || amount == 0) { showToast('مبلغ رو وارد کن ⚠️'); return; }
  // Auto add 3 zeros (user types in thousands)
  amount = parseInt(amount) * 1000;
  const desc = document.getElementById('desc').value.trim();
  if (!desc) { showToast('توضیح رو وارد کن ⚠️'); return; }
  
  const now = new Date();
  const options = { timeZone: 'Asia/Tehran', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false };
  const tehran = new Date(now.toLocaleString('en-US', options));
  const year = tehran.getFullYear();
  const month = String(tehran.getMonth() + 1).padStart(2, '0');
  const day = String(tehran.getDate()).padStart(2, '0');
  const hour = String(tehran.getHours()).padStart(2, '0');
  const min = String(tehran.getMinutes()).padStart(2, '0');
  const dateStr = `${year}/${month}/${day} ${hour}:${min}`;
  
  entries.push({
    type: type,
    amount: parseInt(amount),
    desc: desc,
    card: card,
    date: dateStr
  });
  
  localStorage.setItem('dakhel_entries', JSON.stringify(entries));
  
  document.getElementById('amount').value = '';
  document.getElementById('desc').value = '';
  
  renderAll();
  showToast(type === 'expense' ? 'خرج ثبت شد ✓' : 'دخل ثبت شد ✓');
}

function deleteEntry(i) {
  entries.splice(i, 1);
  localStorage.setItem('dakhel_entries', JSON.stringify(entries));
  renderAll();
}

function renderAll() {
  const list = document.getElementById('entriesList');
  const totalExp = entries.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
  const totalInc = entries.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
  const balance = totalInc - totalExp;
  
  document.getElementById('totalExpense').textContent = fmt(totalExp);
  document.getElementById('totalIncome').textContent = fmt(totalInc);
  document.getElementById('balance').textContent = fmt(balance);
  document.getElementById('summarySection').style.display = entries.length > 0 ? 'block' : 'none';
  
  if (entries.length === 0) {
    list.innerHTML = '<div class="empty">هنوز تراکنشی ثبت نشده</div>';
    return;
  }
  
  let html = '';
  for (let i = entries.length - 1; i >= 0; i--) {
    const e = entries[i];
    const isExp = e.type === 'expense';
    html += `<div class="entry">
      <div class="entry-info">
        <div class="entry-amount ${isExp ? 'entry-type-exp' : 'entry-type-inc'}">${isExp ? '-' : '+'} ${fmt(e.amount)} تومان</div>
        <div class="entry-desc">${e.desc}</div>
        <div class="entry-meta">💳 ${e.card} · ${e.date}</div>
      </div>
      <button class="entry-delete" onclick="deleteEntry(${i})">✕</button>
    </div>`;
  }
  list.innerHTML = html;
}

function copyAll() {
  if (entries.length === 0) { showToast('چیزی نیست برای کپی ⚠️'); return; }
  
  let text = 'خرج\n';
  for (const e of entries) {
    if (e.type === 'expense') {
      text += `چقدر؟ | ${fmt(e.amount)}\nبابت؟ | ${e.desc}\nاز کدوم کارت؟ | ${e.card}\n--------------------------------------------------\n`;
    }
  }
  text += '\nدخل\n';
  for (const e of entries) {
    if (e.type === 'income') {
      text += `📆 [${e.date.replace(' ', ' | ')}]\n💰 مبلغ: ${fmt(e.amount)}\n📝 بابت: ${e.desc}\n💳 کارت: ${e.card}\n--------------------------------------------------\n`;
    }
  }
  
  navigator.clipboard.writeText(text).then(() => {
    showToast('کپی شد! ✅ بفرستش برای ربات');
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('کپی شد! ✅');
  });
}

function clearAll() {
  if (!confirm('همه چی پاک بشه؟')) return;
  entries = [];
  localStorage.setItem('dakhel_entries', JSON.stringify(entries));
  renderAll();
  showToast('پاک شد 🗑');
}

function fmt(n) {
  return n.toLocaleString('fa-IR');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
