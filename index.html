<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="خرج">
<meta name="theme-color" content="#0a0a1a">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>💰 دخل و خرج</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IRANSansX:wght@300;400;500;700;900&family=Orbitron:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a1a;--card:#111128;--border:#1e1e44;--acc:#00e87b;--red:#ff1744;--txt:#c8c8e0;--mut:#5a5a7e;--gld:#f59e0b}
body{font-family:'IRANSansX',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:16px;padding-bottom:120px;overflow-x:hidden}

/* Animated background particles */
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 50%,rgba(0,232,123,.04) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(6,182,212,.04) 0%,transparent 50%),radial-gradient(circle at 50% 80%,rgba(168,85,247,.03) 0%,transparent 50%);pointer-events:none;z-index:-1}

.header{text-align:center;padding:24px 0 16px;position:relative}
.header h1{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;background:linear-gradient(135deg,#00e87b,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:1px}
.header p{color:var(--mut);font-size:13px;margin-top:6px}

/* Card style */
.card{background:linear-gradient(145deg,#12122a,#0e0e22);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;right:0;width:60px;height:60px;background:radial-gradient(circle,rgba(0,232,123,.08),transparent);pointer-events:none}

/* Type selector */
.type-row{display:flex;gap:10px;margin-bottom:0}
.type-btn{flex:1;padding:16px 10px;border:2px solid var(--border);border-radius:16px;background:var(--card);color:var(--txt);font-family:'IRANSansX',sans-serif;font-size:15px;font-weight:700;cursor:pointer;text-align:center;transition:all .3s;position:relative;overflow:hidden}
.type-btn::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:3px;border-radius:3px;transition:width .3s}
.type-btn.active-expense{border-color:var(--red);background:rgba(255,23,68,.08);color:var(--red);box-shadow:0 0 20px rgba(255,23,68,.1)}
.type-btn.active-expense::after{width:40px;background:var(--red)}
.type-btn.active-income{border-color:var(--acc);background:rgba(0,232,123,.08);color:var(--acc);box-shadow:0 0 20px rgba(0,232,123,.1)}
.type-btn.active-income::after{width:40px;background:var(--acc)}

/* Form */
.form-group{margin-bottom:16px}
.form-group label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-bottom:8px;font-weight:500}
.form-group label span{font-size:14px}
.form-group input,.form-group select{width:100%;padding:14px 16px;background:rgba(10,10,26,.6);border:1.5px solid var(--border);border-radius:14px;color:var(--txt);font-family:'IRANSansX',sans-serif;font-size:16px;outline:none;transition:all .3s}
.form-group input:focus{border-color:var(--acc);box-shadow:0 0 15px rgba(0,232,123,.08)}
.form-group input::placeholder{color:var(--mut);opacity:.5}

/* Amount input special */
.amount-wrap{position:relative}
.amount-wrap::after{content:'تومان';position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:12px;opacity:.6}
.amount-wrap input{padding-left:60px}

/* Card buttons */
.card-row{display:flex;gap:10px}
.card-btn{flex:1;padding:14px;border:2px solid var(--border);border-radius:14px;background:var(--card);color:var(--txt);font-family:'IRANSansX',sans-serif;font-size:14px;font-weight:600;cursor:pointer;text-align:center;transition:all .3s;position:relative}
.card-btn.active{border-color:var(--gld);background:rgba(245,158,11,.08);color:var(--gld);box-shadow:0 0 15px rgba(245,158,11,.08)}

/* Submit */
.submit-btn{width:100%;padding:18px;border:none;border-radius:16px;font-family:'IRANSansX',sans-serif;font-weight:900;font-size:17px;cursor:pointer;transition:all .3s;letter-spacing:.5px;position:relative;overflow:hidden}
.submit-btn:active{transform:scale(.97)}
.submit-btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);transition:left .5s}
.submit-btn:active::after{left:100%}
.submit-expense{background:linear-gradient(135deg,#ff2255,#cc1133);color:#fff;box-shadow:0 4px 20px rgba(255,23,68,.3)}
.submit-income{background:linear-gradient(135deg,#00ff8a,#00c06a);color:#000;box-shadow:0 4px 20px rgba(0,232,123,.3)}

/* Entries */
.entries{margin-top:8px}
.entries h3{font-family:'Orbitron',sans-serif;font-size:14px;margin-bottom:14px;color:var(--gld);letter-spacing:.5px}
.entry{background:linear-gradient(145deg,#12122a,#0e0e22);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;transition:all .3s;position:relative;overflow:hidden}
.entry::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;border-radius:0 4px 4px 0}
.entry.exp::before{background:var(--red)}
.entry.inc::before{background:var(--acc)}
.entry-info{flex:1}
.entry-amount{font-weight:900;font-size:17px;font-family:'Orbitron',sans-serif;letter-spacing:-.5px}
.entry-desc{font-size:13px;color:var(--txt);margin-top:4px;font-weight:500}
.entry-meta{font-size:11px;color:var(--mut);margin-top:6px;display:flex;align-items:center;gap:8px}
.entry-meta .tag{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600}
.entry-meta .tag-melat{background:rgba(245,158,11,.1);color:var(--gld);border:1px solid rgba(245,158,11,.2)}
.entry-meta .tag-saderat{background:rgba(6,182,212,.1);color:var(--cyn);border:1px solid rgba(6,182,212,.2)}
.entry-type-exp{color:var(--red)}
.entry-type-inc{color:var(--acc)}
.entry-delete{padding:8px 12px;background:rgba(255,23,68,.06);border:1px solid rgba(255,23,68,.15);border-radius:10px;color:var(--red);cursor:pointer;font-size:14px;font-family:'IRANSansX',sans-serif;transition:all .2s}
.entry-delete:active{background:rgba(255,23,68,.2);transform:scale(.9)}

/* Summary */
.summary{background:linear-gradient(145deg,#12122a,#0e0e22);border:1px solid var(--border);border-radius:20px;padding:20px;margin-top:16px;position:relative;overflow:hidden}
.summary::before{content:'';position:absolute;top:-30px;left:-30px;width:100px;height:100px;background:radial-gradient(circle,rgba(0,232,123,.06),transparent);pointer-events:none}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
.summary-row.total{border-top:1px solid var(--border);margin-top:8px;padding-top:12px;font-weight:900;font-size:18px;font-family:'Orbitron',sans-serif}

/* Actions */
.actions{display:flex;gap:10px;margin-top:16px}
.action-btn{flex:1;padding:16px;border:none;border-radius:14px;font-family:'IRANSansX',sans-serif;font-weight:700;font-size:14px;cursor:pointer;text-align:center;transition:all .2s}
.action-btn:active{transform:scale(.96)}
.copy-btn{background:linear-gradient(135deg,#00b4d8,#0077b6);color:#fff;box-shadow:0 4px 15px rgba(0,180,216,.2)}
.clear-btn{background:rgba(255,23,68,.08);color:var(--red);border:1px solid rgba(255,23,68,.2)}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:14px 28px;background:linear-gradient(135deg,#00e87b,#00c06a);color:#000;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:all .3s;z-index:99;pointer-events:none;box-shadow:0 8px 30px rgba(0,232,123,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-5px)}

.empty{text-align:center;padding:32px;color:var(--mut);font-size:14px;line-height:2}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<div class="header">
  <h1>💰 DAKHEL</h1>
  <p>ثبت دخل و خرج ماهانه</p>
</div>

<div class="card">
  <div class="type-row">
    <div class="type-btn active-expense" id="btnExpense" onclick="setType('expense')">🔴 خرج</div>
    <div class="type-btn" id="btnIncome" onclick="setType('income')">🟢 دخل</div>
  </div>
</div>

<div class="card">
  <div class="form-group">
    <label><span>💰</span> مبلغ (هزار تومان)</label>
    <div class="amount-wrap">
      <input type="text" id="amount" inputmode="numeric" placeholder="مثلاً ۵۰۰ یا 500">
    </div>
  </div>
  <div class="form-group">
    <label><span>📝</span> بابت چی؟</label>
    <input type="text" id="desc" placeholder="نون، اسنپ، آرایشگاه...">
  </div>
  <div class="form-group">
    <label><span>💳</span> کارت</label>
    <div class="card-row">
      <div class="card-btn active" id="cardMelat" onclick="setCard('ملت')">💳 ملت</div>
      <div class="card-btn" id="cardSaderat" onclick="setCard('صادرات')">💳 صادرات</div>
    </div>
  </div>
  <button class="submit-btn submit-expense" id="submitBtn" onclick="addEntry()">➕ ثبت خرج</button>
</div>

<div class="entries" id="entriesSection">
  <h3>📝 تراکنش‌ها</h3>
  <div id="entriesList"></div>
</div>

<div class="summary" id="summarySection" style="display:none">
  <div class="summary-row"><span>🔴 جمع خرج</span><span id="totalExpense" style="color:var(--red)">۰</span></div>
  <div class="summary-row"><span>🟢 جمع دخل</span><span id="totalIncome" style="color:var(--acc)">۰</span></div>
  <div class="summary-row total"><span>💰 مانده</span><span id="balance">۰</span></div>
</div>

<div class="actions">
  <button class="action-btn copy-btn" onclick="copyAll()">📋 کپی همه</button>
  <button class="action-btn clear-btn" onclick="clearAll()">🗑 پاک کردن</button>
</div>

<div class="toast" id="toast"></div>

<script>
let type = 'expense';
let card = 'ملت';
let entries = JSON.parse(localStorage.getItem('dakhel_entries') || '[]');
setType('expense');
renderAll();

function setType(t) {
  type = t;
  document.getElementById('btnExpense').className = t === 'expense' ? 'type-btn active-expense' : 'type-btn';
  document.getElementById('btnIncome').className = t === 'income' ? 'type-btn active-income' : 'type-btn';
  const btn = document.getElementById('submitBtn');
  if (t === 'expense') {
    btn.className = 'submit-btn submit-expense';
    btn.textContent = '➕ ثبت خرج';
  } else {
    btn.className = 'submit-btn submit-income';
    btn.textContent = '➕ ثبت دخل';
  }
}

function setCard(c) {
  card = c;
  document.getElementById('cardMelat').className = c === 'ملت' ? 'card-btn active' : 'card-btn';
  document.getElementById('cardSaderat').className = c === 'صادرات' ? 'card-btn active' : 'card-btn';
}

function faToEn(s){const m={'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};return s.replace(/[۰-۹]/g,c=>m[c]||c)}

function gregorianToJalali(gy,gm,gd){
  var g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  var gy2=(gm>2)?(gy+1):gy;
  var days=355666+(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+g_d_m[gm-1];
  var jy=-1595+Math.floor(33*(Math.floor(days/12053)));
  days=days%12053;
  jy+=4*Math.floor(days/1461);
  days=days%1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365;}
  var jm,jd;
  if(days<186){jm=1+Math.floor(days/31);jd=1+days%31;}else{jm=7+Math.floor((days-186)/30);jd=1+(days-186)%30;}
  return[jy,jm,jd];
}

function addEntry() {
  let raw = document.getElementById('amount').value.trim();
  let amount = faToEn(raw).replace(/,/g, '');
  if (!amount || amount == 0) { showToast('مبلغ رو وارد کن ⚠️'); return; }
  amount = parseInt(amount) * 1000;
  const desc = document.getElementById('desc').value.trim();
  if (!desc) { showToast('توضیح رو وارد کن ⚠️'); return; }

  // Get Tehran time properly
  const now = new Date();
  const tehranStr = now.toLocaleString('sv-SE', { timeZone: 'Asia/Tehran' });
  // sv-SE gives: "2026-08-21 13:45:30"
  const parts = tehranStr.split(' ');
  const dateParts = parts[0].split('-');
  const timeParts = parts[1].split(':');
  const gy = parseInt(dateParts[0]);
  const gm = parseInt(dateParts[1]);
  const gd = parseInt(dateParts[2]);
  const hh = timeParts[0];
  const mm = timeParts[1];

  const jalali = gregorianToJalali(gy, gm, gd);
  const jMonthNames = ['','فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  const dateStr = `${jalali[0]}/${String(jalali[1]).padStart(2,'0')}/${String(jalali[2]).padStart(2,'0')} ${jMonthNames[jalali[1]]} ${hh}:${mm}`;

  entries.push({ type, amount, desc, card, date: dateStr });
  localStorage.setItem('dakhel_entries', JSON.stringify(entries));
  document.getElementById('amount').value = '';
  document.getElementById('desc').value = '';
  renderAll();
  showToast(type === 'expense' ? 'خرج ثبت شد ✓' : 'دخل ثبت شد ✓');
}

function deleteEntry(i) {
  entries.splice(i, 1);
  localStorage.setItem('dakhel_entries', JSON.stringify(entries));
  renderAll();
}

function renderAll() {
  const list = document.getElementById('entriesList');
  const totalExp = entries.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
  const totalInc = entries.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
  const balance = totalInc - totalExp;

  document.getElementById('totalExpense').textContent = fmt(totalExp);
  document.getElementById('totalIncome').textContent = fmt(totalInc);
  document.getElementById('balance').textContent = fmt(balance);
  document.getElementById('summarySection').style.display = entries.length > 0 ? 'block' : 'none';

  if (entries.length === 0) {
    list.innerHTML = '<div class="empty">هنوز تراکنشی ثبت نشده 📝<br>از بالا شروع کن!</div>';
    return;
  }

  let html = '';
  for (let i = entries.length - 1; i >= 0; i--) {
    const e = entries[i];
    const isExp = e.type === 'expense';
    const cardClass = e.card === 'ملت' ? 'tag-melat' : 'tag-saderat';
    html += `<div class="entry ${isExp ? 'exp' : 'inc'}">
      <div class="entry-info">
        <div class="entry-amount ${isExp ? 'entry-type-exp' : 'entry-type-inc'}">${isExp ? '−' : '+'} ${fmt(e.amount)}</div>
        <div class="entry-desc">${e.desc}</div>
        <div class="entry-meta"><span class="tag ${cardClass}">${e.card}</span> ${e.date}</div>
      </div>
      <button class="entry-delete" onclick="deleteEntry(${i})">✕</button>
    </div>`;
  }
  list.innerHTML = html;
}

function copyAll() {
  if (entries.length === 0) { showToast('چیزی نیست برای کپی ⚠️'); return; }
  let text = 'خرج\n';
  for (const e of entries) {
    if (e.type === 'expense') {
      text += `📆 [${e.date}]\n💰 مبلغ: ${fmt(e.amount)}\n📝 بابت: ${e.desc}\n💳 کارت: ${e.card}\n--------------------------------------------------\n`;
    }
  }
  text += '\nدخل\n';
  for (const e of entries) {
    if (e.type === 'income') {
      text += `📆 [${e.date}]\n💰 مبلغ: ${fmt(e.amount)}\n📝 بابت: ${e.desc}\n💳 کارت: ${e.card}\n--------------------------------------------------\n`;
    }
  }
  navigator.clipboard.writeText(text).then(() => {
    showToast('کپی شد! ✅ بفرستش برای ربات');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('کپی شد! ✅');
  });
}

function clearAll() {
  if (!confirm('همه چی پاک بشه؟')) return;
  entries = [];
  localStorage.setItem('dakhel_entries', JSON.stringify(entries));
  renderAll();
  showToast('پاک شد 🗑');
}

function fmt(n) { return n.toLocaleString('fa-IR'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
