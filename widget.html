<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ثبت سریع">
<meta name="theme-color" content="#08090f">
<script>
try{
  var _t=localStorage.getItem("dakhel_theme");
  if(_t==="light"||_t==="dark"){document.documentElement.setAttribute("data-theme",_t);}
  else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches){
    document.documentElement.setAttribute("data-theme","light");
  }
}catch(e){}
</script>
<link rel="apple-touch-icon" href="widget-icon.png">
<title>ثبت سریع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="styles.css">
<script>
/* این صفحه هم آفلاین باز شود، حتی اگر قبلاً فقط خودش باز شده باشد */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    try {
      navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {});
    } catch (e) {}
  });
}
</script>
<style>
.acc-card.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-24),var(--shadow)}
.sheet-title{margin-top:2px}
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"></div>

<header class="topbar">
  <h1>ثبت سریع</h1>
  <div class="tb-actions">
    <a class="icon-btn" href="index.html" aria-label="برنامه کامل" style="text-decoration:none">↩</a>
  </div>
</header>

<main>
  <section class="page is-active">
    <div class="sec-head"><span>حساب‌ها</span><span class="muted" id="totalShort"></span></div>
    <div class="acc-row" id="accRow"></div>

    <div class="seg" id="wType" style="margin-bottom:12px">
      <button class="seg-btn is-on" data-t="expense">خرج</button>
      <button class="seg-btn" data-t="income">دخل</button>
    </div>

    <div class="field amount-field">
      <label for="wAmt">مبلغ (هزار تومان)</label>
      <input type="text" id="wAmt" class="amount-input" inputmode="numeric"
             placeholder="۰" autocomplete="off" enterkeyhint="done">
      <div class="amount-hint" id="wHint"></div>
    </div>

    <div class="field">
      <label>توضیح</label>
      <input type="text" id="wDesc" placeholder="نان، اسنپ، قبض…" autocomplete="off">
      <div class="chips" id="descChips"></div>
    </div>

    <button class="btn exp" id="wSubmit">ثبت خرج</button>
    <a class="btn-ghost" href="index.html"
       style="display:block;text-align:center;margin-top:10px;text-decoration:none;line-height:1.4">
      باز کردن برنامه کامل
    </a>
    <p class="fineprint" style="margin-top:16px">ثبت‌ها مستقیم در همان حافظه‌ی برنامه‌ی اصلی ذخیره می‌شوند.</p>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
'use strict';

var SK = {
  entries: 'dakhel_entries', bal: 'dakhel_bal', accs: 'dakhel_accs',
  theme: 'dakhel_theme', last: 'dakhel_last'
};
var MONTHS = ['', 'فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
var FA = '۰۱۲۳۴۵۶۷۸۹';
var COLOR_ORDER = ['slate', 'blue', 'amber', 'mint', 'violet', 'rose', 'orange', 'bronze', 'pink', 'cyan'];
var OLD_COLORS = {
  melat: 'slate', sad: 'blue', cash: 'amber', pur: 'violet', grn: 'mint',
  red: 'rose', org: 'orange', brn: 'bronze', pink: 'pink', sky: 'cyan'
};
var ACC_DEF = [
  { id: 'melat', name: 'ملت', icon: '💳', color: 'slate' },
  { id: 'sad', name: 'صادرات', icon: '💳', color: 'blue' },
  { id: 'cash', name: 'نقدی', icon: '💵', color: 'amber' }
];

function $(id) { return document.getElementById(id); }
function readJSON(k, f) {
  try { var v = localStorage.getItem(k); return v === null ? f : JSON.parse(v); }
  catch (e) { return f; }
}
function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function toFa(s) { return String(s).replace(/[0-9]/g, function (c) { return FA.charAt(+c); }); }
function toEn(s) {
  return String(s).replace(/[۰-۹]/g, function (c) { var i = FA.indexOf(c); return i < 0 ? c : String(i); });
}
function fmt(n) {
  n = Math.round(Number(n) || 0);
  var neg = n < 0;
  return toFa((neg ? '−' : '') + Math.abs(n).toLocaleString('en-US').replace(/,/g, '٬'));
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function uid() { return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function buzz(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }

var toastTimer = null;
function toast(msg) {
  var t = $('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('is-on'); }, 2000);
}

/* ── تقویم شمسی ── */
function g2j(gy, gm, gd) {
  var g = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  var y2 = gm > 2 ? gy + 1 : gy;
  var d = 355666 + 365 * gy + Math.floor((y2 + 3) / 4) - Math.floor((y2 + 99) / 100) +
          Math.floor((y2 + 399) / 400) + gd + g[gm - 1];
  var jy = -1595 + 33 * Math.floor(d / 12053);
  d %= 12053;
  jy += 4 * Math.floor(d / 1461);
  d %= 1461;
  if (d > 365) { jy += Math.floor((d - 1) / 365); d = (d - 1) % 365; }
  if (d < 186) return [jy, 1 + Math.floor(d / 31), 1 + d % 31];
  return [jy, 7 + Math.floor((d - 186) / 30), 1 + (d - 186) % 30];
}
function nowJ() {
  try {
    var s = new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Tehran' });
    var p = s.split(' ');
    var d = p[0].split('-');
    var t = (p[1] || '00:00:00').split(':');
    var j = g2j(+d[0], +d[1], +d[2]);
    return { y: j[0], m: j[1], d: j[2], time: pad2(+t[0] || 0) + ':' + pad2(+t[1] || 0) };
  } catch (e) {
    var n = new Date();
    var jj = g2j(n.getFullYear(), n.getMonth() + 1, n.getDate());
    return { y: jj[0], m: jj[1], d: jj[2], time: pad2(n.getHours()) + ':' + pad2(n.getMinutes()) };
  }
}

/* ── داده ── */
function normAccounts(raw) {
  var list = Array.isArray(raw) ? raw : null;
  if (!list || !list.length) return JSON.parse(JSON.stringify(ACC_DEF));
  var out = [];
  for (var i = 0; i < list.length; i++) {
    var a = list[i];
    if (!a || typeof a !== 'object') continue;
    var color = String(a.color || '');
    if (OLD_COLORS[color]) color = OLD_COLORS[color];
    if (COLOR_ORDER.indexOf(color) < 0) color = COLOR_ORDER[i % COLOR_ORDER.length];
    out.push({
      id: a.id ? String(a.id) : 'a' + i + uid(),
      name: (a.name == null ? '' : String(a.name)).trim() || ('حساب ' + (i + 1)),
      icon: a.icon ? String(a.icon) : '💳',
      color: color
    });
  }
  return out.length ? out : JSON.parse(JSON.stringify(ACC_DEF));
}

var accounts = normAccounts(readJSON(SK.accs, null));
var balances = readJSON(SK.bal, {}) || {};
var last = readJSON(SK.last, {}) || {};

var state = {
  type: last.type === 'income' ? 'income' : 'expense',
  acc: '',
  raw: ''
};

function accByName(name) {
  for (var i = 0; i < accounts.length; i++) if (accounts[i].name === name) return accounts[i];
  return null;
}
state.acc = (last.acc && accByName(last.acc)) ? last.acc : (accounts.length ? accounts[0].name : '');

/* ── رندر ── */
function render() {
  var total = 0;
  accounts.forEach(function (a) { total += Number(balances[a.id]) || 0; });

  var h = '';
  accounts.forEach(function (a) {
    h += '<button class="acc-card c-' + a.color + (state.acc === a.name ? ' sel' : '') + '"' +
         ' data-acc="' + esc(a.name) + '">' +
           '<span class="acc-top"><span class="acc-dot"></span>' +
             '<span class="acc-name">' + esc(a.name) + '</span></span>' +
           '<span class="acc-bal">' + fmt(Number(balances[a.id]) || 0) + '</span>' +
           '<span class="acc-unit">تومان</span>' +
         '</button>';
  });
  var row = $('accRow');
  if (row) row.innerHTML = h || '<span class="muted">حسابی نیست</span>';

  var sub = $('totalShort');
  if (sub) sub.textContent = 'جمع ' + fmt(total) + ' تومان';

  var segs = document.querySelectorAll('#wType .seg-btn');
  for (var i = 0; i < segs.length; i++) {
    segs[i].classList.toggle('is-on', segs[i].dataset.t === state.type);
  }

  var amtEl = $('wAmt');
  if (amtEl) {
    var shown = state.raw ? fmtDigits(state.raw) : '';
    if (amtEl.value !== shown) amtEl.value = shown;
  }
  var hint = $('wHint');
  if (hint) hint.textContent = state.raw ? '= ' + fmt(Number(state.raw) * 1000) + ' تومان' : '';

  var btn = $('wSubmit');
  if (btn) {
    var inc = state.type === 'income';
    btn.className = 'btn ' + (inc ? 'inc' : 'exp');
    btn.textContent = 'ثبت ' + (inc ? 'دخل' : 'خرج');
  }
}

function fillDescChips() {
  var box = $('descChips');
  if (!box) return;
  var list = readJSON(SK.entries, []);
  if (!Array.isArray(list)) list = [];
  var seen = {}, arr = [];
  for (var i = 0; i < list.length && arr.length < 8; i++) {
    var d = list[i] && list[i].desc ? String(list[i].desc) : '';
    if (d && d !== 'بدون توضیح' && !seen[d]) { seen[d] = 1; arr.push(d); }
  }
  box.innerHTML = arr.map(function (d) {
    return '<button class="chip-btn" data-desc="' + esc(d) + '">' + esc(d) + '</button>';
  }).join('');
}

function fmtDigits(raw) {
  return raw
    ? toFa(Number(raw).toLocaleString('en-US').replace(/,/g, '٬'))
    : '';
}
function digitsOnly(s) {
  return toEn(s == null ? '' : String(s)).replace(/[^\d]/g, '');
}
function caretForDigits(str, n) {
  if (n <= 0) return 0;
  var seen = 0;
  for (var i = 0; i < str.length; i++) {
    if (/[0-9۰-۹]/.test(str.charAt(i))) {
      seen++;
      if (seen === n) return i + 1;
    }
  }
  return str.length;
}

/* کیبورد عددی خود گوشی — ورودی مبلغ مستقیم تایپ می‌شود */
function onAmountInput(el) {
  if (!el) return;
  var val = String(el.value || '');
  var pos = val.length;
  try { if (el.selectionStart != null) pos = el.selectionStart; } catch (e) {}

  var before = digitsOnly(val.slice(0, pos)).length;
  var raw = digitsOnly(val).slice(0, 10);
  state.raw = raw;

  var out = fmtDigits(raw);
  if (el.value !== out) {
    el.value = out;
    try {
      var c = caretForDigits(out, before);
      el.setSelectionRange(c, c);
    } catch (e) {}
  }
  render();
}

/* ── ثبت ── */
function submit() {
  var thousands = parseInt(state.raw, 10) || 0;
  if (thousands <= 0) { toast('مبلغ را وارد کن'); return; }
  var descEl = $('wDesc');
  var desc = (descEl ? descEl.value : '').trim();
  if (!desc) { toast('توضیح را وارد کن'); return; }

  /* همیشه از حافظه‌ی تازه بخوان تا داده‌های برنامه‌ی اصلی از دست نرود */
  accounts = normAccounts(readJSON(SK.accs, null));
  balances = readJSON(SK.bal, {}) || {};

  var acc = accByName(state.acc) || accounts[0];
  if (!acc) { toast('اول در برنامه‌ی اصلی یک حساب بساز'); return; }

  var list = readJSON(SK.entries, []);
  if (!Array.isArray(list)) list = [];

  var amount = thousands * 1000;
  var j = nowJ();
  list.unshift({
    id: uid(),
    type: state.type,
    amount: amount,
    desc: desc,
    card: acc.name,
    who: 'me',
    year: j.y, month: j.m, day: j.d,
    time: j.time,
    date: j.y + '/' + pad2(j.m) + '/' + pad2(j.d) + ' ' + MONTHS[j.m] + ' ' + j.time
  });
  writeJSON(SK.entries, list);

  balances[acc.id] = (Number(balances[acc.id]) || 0) + (state.type === 'expense' ? -amount : amount);
  writeJSON(SK.bal, balances);
  writeJSON(SK.last, { acc: acc.name, who: 'me', type: state.type });

  state.acc = acc.name;
  state.raw = '';
  if (descEl) descEl.value = '';
  render();
  fillDescChips();
  toast(state.type === 'expense' ? 'خرج ثبت شد ✓' : 'دخل ثبت شد ✓');
  buzz(12);
}

/* ── رویدادها ── */
document.addEventListener('click', function (ev) {
  var t = ev.target;
  while (t && t !== document && !(t.dataset && (t.dataset.acc || t.dataset.desc || t.dataset.t))) {
    t = t.parentNode;
  }
  if (!t || t === document || !t.dataset) return;

  if (t.dataset.acc) { state.acc = t.dataset.acc; render(); buzz(6); return; }
  if (t.dataset.t) { state.type = t.dataset.t; render(); buzz(6); return; }
  if (t.dataset.desc) {
    var d = $('wDesc');
    if (d) { d.value = t.dataset.desc; d.focus(); }
  }
});

var submitBtn = $('wSubmit');
if (submitBtn) submitBtn.addEventListener('click', submit);
var amtInput = $('wAmt');
if (amtInput) {
  amtInput.addEventListener('input', function () { onAmountInput(this); });
}
var descInput = $('wDesc');
if (descInput) {
  descInput.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); submit(); }
  });
}

var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
if (mq) {
  var onScheme = function () {
    var saved = null;
    try { saved = localStorage.getItem(SK.theme); } catch (e) {}
    if (saved !== 'dark' && saved !== 'light') {
      document.documentElement.setAttribute('data-theme', mq.matches ? 'light' : 'dark');
    }
  };
  if (mq.addEventListener) mq.addEventListener('change', onScheme);
  else if (mq.addListener) mq.addListener(onScheme);
}

render();
fillDescChips();

})();
</script>
</body>
</html>
